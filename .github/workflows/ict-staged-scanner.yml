name: MEXC ICT staged scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mexc-ict-staged-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: MEXC Futures Top 50 ICT taraması
        env:
          ICT_MAX_SYMBOLS: '50'
        run: node ict_style_scanner.js
      - name: Setup verisini commit et
        run: |
          git config user.name "mexc-ict-scanner-bot"
          git config user.email "actions@github.com"
          git add docs/ict-scanner/data.json
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "mexc-ict-scanner: setups güncellendi [skip ci]"
          git pull --rebase origin main || true
          git push
