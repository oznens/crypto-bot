name: Efloud research archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r efloud-research/requirements.txt
      - name: Fetch one year of Efloud tweets and media
        env:
          XQUIK_API_KEY: ${{ secrets.XQUIK_API_KEY }}
        run: python efloud-research/fetch_xquik.py
      - name: Analyze archive
        run: python efloud-research/analyze.py
      - name: Commit archive and analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add efloud-research/data efloud-research/media efloud-research/analysis
          git diff --cached --quiet && exit 0
          git commit -m "Update Efloud research archive"
          git push
