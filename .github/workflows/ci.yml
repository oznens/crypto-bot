name: code-quality

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/paper.yml'
      - 'paper_engine.js'
      - 'paper_analytics.js'
      - 'paper_health.js'
      - 'analysis.js'
      - 'core/**'
      - 'scripts/**'
      - 'docs/summary.html'
      - 'docs/strategy.html'
      - 'test/**'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/paper.yml'
      - 'paper_engine.js'
      - 'paper_analytics.js'
      - 'paper_health.js'
      - 'analysis.js'
      - 'core/**'
      - 'scripts/**'
      - 'docs/summary.html'
      - 'docs/strategy.html'
      - 'test/**'

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Testleri çalıştır
        run: |
          node test/paper_health.test.js
          node test/paper_trade_policy.test.js
          node test/paper_analytics.test.js
          node test/paper_state_validator.test.js
          node test/paper_state_backward_compat.test.js
          node test/validate_paper_state_cli.test.js
          node test/paper_summary.test.js
          node test/strategy_allocator.test.js
          node test/strategy_trade_policy.test.js
          node test/strategy_execution_adapter.test.js
          node test/strategy_ensemble.test.js
          node test/killzone_fvg_engine.test.js
          node test/smt_divergence_engine.test.js
          node test/liquidity_map_engine.test.js
          node test/adaptive_exit_engine.test.js
          node test/strategy_context_pipeline.test.js
          node test/multi_timeframe_alignment.test.js
          node test/confluence_score_engine.test.js
          node test/strategy_decay_engine.test.js
          node test/ict_pattern_pack.test.js
          node test/wyckoff_phase_engine.test.js
          node test/quarterly_theory_engine.test.js
          node test/mmxm_curve_engine.test.js
          node test/sbs_engine.test.js
          node test/session_liquidity_engine.test.js
          node test/strategy_robustness_engine.test.js
          node test/parameter_stability_engine.test.js
          node test/execution_cost_engine.test.js
          node test/portfolio_correlation_engine.test.js
          node test/bige_tdi_engine.test.js
          node test/unicorn_model_engine.test.js
          node test/nine_stars_engine.test.js
          node test/hps_zone_engine.test.js
          node tests/risk_engine.test.js
          node tests/performance_engine.test.js

      - name: Sözdizimini doğrula
        run: |
          node --check paper_engine.js
          node --check paper_analytics.js
          node --check paper_health.js
          node --check core/paper_trade_policy.js
          node --check core/paper_state_validator.js
          node --check core/paper_summary.js
          node --check core/risk_engine.js
          node --check core/performance_engine.js
          node --check core/strategy_ranking_engine.js
          node --check core/strategy_allocator.js
          node --check core/strategy_trade_policy.js
          node --check core/strategy_execution_adapter.js
          node --check core/strategy_ensemble.js
          node --check core/killzone_fvg_engine.js
          node --check core/smt_divergence_engine.js
          node --check core/liquidity_map_engine.js
          node --check core/adaptive_exit_engine.js
          node --check core/strategy_context_pipeline.js
          node --check core/multi_timeframe_alignment.js
          node --check core/confluence_score_engine.js
          node --check core/strategy_decay_engine.js
          node --check core/ict_pattern_pack.js
          node --check core/wyckoff_phase_engine.js
          node --check core/quarterly_theory_engine.js
          node --check core/mmxm_curve_engine.js
          node --check core/sbs_engine.js
          node --check core/session_liquidity_engine.js
          node --check core/strategy_robustness_engine.js
          node --check core/parameter_stability_engine.js
          node --check core/execution_cost_engine.js
          node --check core/portfolio_correlation_engine.js
          node --check core/bige_tdi_engine.js
          node --check core/unicorn_model_engine.js
          node --check core/nine_stars_engine.js
          node --check core/hps_zone_engine.js
          node --check scripts/validate_paper_state.js
          node --check scripts/build_paper_summary.js
          node --check scripts/build_strategy_allocation.js
          node --check scripts/run_paper_v9.js
          node --check scripts/run_paper_v13.js
