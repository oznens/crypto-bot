name: Galatali BIST Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "20 16 * * 1-5"
  push:
    branches: [main]
    paths:
      - "tools/galatali_bist_scanner.py"
      - "tools/galatali_prz_scanner.py"
      - "tools/galatali_chart_export.py"
      - ".github/workflows/galatali-bist-scanner.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/galatali_bist_scanner.py"
      - "tools/galatali_prz_scanner.py"
      - "tools/galatali_chart_export.py"
      - "galatali-bist/index.html"
      - ".github/workflows/galatali-bist-scanner.yml"

permissions:
  contents: write

concurrency:
  group: galatali-bist-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TradingView datafeed
        run: python -m pip install --quiet tradingview-datafeed pandas
      - name: Prepare diagnostics
        run: |
          mkdir -p data/galatali_bist
          echo "run_id=${GITHUB_RUN_ID}" > data/galatali_bist/workflow_status.txt
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> data/galatali_bist/workflow_status.txt
      - name: Run completed harmonic scanner
        id: scan
        continue-on-error: true
        run: python tools/galatali_bist_scanner.py > data/galatali_bist/stdout.txt 2> data/galatali_bist/stderr.txt
      - name: Run developing PRZ scanner
        id: prz
        continue-on-error: true
        run: python tools/galatali_prz_scanner.py > data/galatali_bist/prz_stdout.txt 2> data/galatali_bist/prz_stderr.txt
      - name: Export chart candles
        id: charts
        continue-on-error: true
        run: python tools/galatali_chart_export.py > data/galatali_bist/chart_stdout.txt 2> data/galatali_bist/chart_stderr.txt
      - name: Commit scanner results
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/galatali_bist
          if ! git diff --cached --quiet; then git commit -m "Update Galatali BIST scan" && git push; fi
      - name: Fail if scanner failed
        if: steps.scan.outcome == 'failure' || steps.prz.outcome == 'failure' || steps.charts.outcome == 'failure'
        run: exit 1
