name: Galatali BIST Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "20 16 * * 1-5"
  push:
    branches: [main]
    paths:
      - "tools/galatali_bist_scanner.py"
      - ".github/workflows/galatali-bist-scanner.yml"

permissions:
  contents: write

concurrency:
  group: galatali-bist-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run BIST scanner
        run: python tools/galatali_bist_scanner.py
      - name: Commit scanner results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/galatali_bist
          if git diff --cached --quiet; then
            echo "No scanner changes"
          else
            git commit -m "Update Galatali BIST scan"
            git push
          fi
