name: Galatali BIST Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "20 16 * * 1-5"
  push:
    branches: [main]
    paths:
      - "tools/galatali_bist_scanner.py"
      - ".github/workflows/galatali-bist-scanner.yml"

permissions:
  contents: write

concurrency:
  group: galatali-bist-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare diagnostics
        shell: bash
        run: |
          mkdir -p data/galatali_bist
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > data/galatali_bist/workflow_status.txt

      - name: Run BIST scanner
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python tools/galatali_bist_scanner.py > data/galatali_bist/stdout.txt 2> data/galatali_bist/stderr.txt
          rc=$?
          echo "exit_code=$rc" >> data/galatali_bist/workflow_status.txt
          exit $rc

      - name: Commit scanner results and diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/galatali_bist
          if git diff --cached --quiet; then
            echo "No scanner changes"
          else
            git commit -m "Update Galatali BIST scan diagnostics"
            git push
          fi

      - name: Fail if scanner failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
