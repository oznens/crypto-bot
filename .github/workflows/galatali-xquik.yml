name: Galatali XQuik Archive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/galatali-xquik.yml"
      - "tools/galatali_xquik_fetch.py"

permissions:
  contents: write

concurrency:
  group: galatali-xquik
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare diagnostics
        shell: bash
        env:
          XQUIK_API_KEY: ${{ secrets.X_QUIK_API_KEY }}
        run: |
          mkdir -p data/galatali
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "event=${GITHUB_EVENT_NAME}"
            if [ -n "$XQUIK_API_KEY" ]; then
              echo "secret_present=yes"
            else
              echo "secret_present=no"
            fi
          } > data/galatali/workflow_status.txt

      - name: Fetch GalataliBorsaci tweets
        id: fetch
        continue-on-error: true
        env:
          XQUIK_API_KEY: ${{ secrets.X_QUIK_API_KEY }}
          XQUIK_USERNAME: GalataliBorsaci
          XQUIK_MAX_PAGES: "25"
          XQUIK_LIMIT: "200"
        shell: bash
        run: |
          set +e
          python tools/galatali_xquik_fetch.py > data/galatali/fetch_stdout.txt 2> data/galatali/fetch_stderr.txt
          rc=$?
          echo "exit_code=$rc" >> data/galatali/workflow_status.txt
          exit $rc

      - name: Commit diagnostics and archive
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/galatali
          if git diff --cached --quiet; then
            echo "No Galatali changes to commit"
          else
            git commit -m "Update Galatali X archive diagnostics"
            git push
          fi

      - name: Fail workflow if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1
