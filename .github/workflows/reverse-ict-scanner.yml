name: Reverse ICT Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'

permissions:
  contents: write

concurrency:
  group: reverse-ict-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run MEXC Futures scanner
        run: node reverse_ict_mexc.js

      - name: Commit latest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reverse-ict/data.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update reverse ICT MEXC scanner data"
          git pull --rebase origin main
          git push origin HEAD:main