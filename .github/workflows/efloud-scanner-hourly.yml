name: Efloud scanner hourly

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: efloud-scanner-hourly
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run scanner
        run: node scripts/efloud-scanner-background.mjs
      - name: Publish JSON result
        run: |
          if git diff --quiet -- docs/efloud-scanner-results.json; then
            echo "No result change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/efloud-scanner-results.json
          git commit -m "update hourly Efloud scan"
          git push
