name: Yusuf Trades XAUUSD Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtests/yusuf_trades_xau.py'
      - '.github/workflows/yusuf-trades-xau-backtest.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas
      - name: Run backtest
        run: python backtests/yusuf_trades_xau.py
      - name: Show summary
        run: cat backtests/yusuf-results/summary.json
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/yusuf-results
          git diff --cached --quiet || git commit -m "Update Yusuf Trades XAUUSD backtest results"
          git push
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: yusuf-trades-xau-results
          path: backtests/yusuf-results/
