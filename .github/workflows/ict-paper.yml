name: ict-paper

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ict-paper.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: ict-paper
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: oznens/Mmxm
          ref: agent/ict-mmxm-turtle-scanner-v1
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/scanner_v1/requirements.txt
      - name: Install scanner
        run: pip install -r engine/scanner_v1/requirements.txt
      - name: Restore paper state
        run: |
          mkdir -p engine/scanner_v1/data ict-paper-state
          if [ -f ict-paper-state/setups.db ]; then cp ict-paper-state/setups.db engine/scanner_v1/data/setups.db; fi
      - name: Scan Bybit top 50
        working-directory: engine/scanner_v1
        env:
          TOP_N: '50'
          MIN_SCORE: '75'
          STATE_DB: data/setups.db
          PAPER_START_BALANCE: '1000'
          PAPER_RISK_PCT: '0.01'
          CHARTS_ENABLED: 'false'
          ALERT_ON_CHANGE_ONLY: 'true'
        run: python main.py
      - name: Export dashboard data
        working-directory: engine/scanner_v1
        env:
          STATE_DB: data/setups.db
          PAGES_DIR: ../../docs/ict-paper
        run: python pages_export.py
      - name: Persist state and publish data
        run: |
          cp engine/scanner_v1/data/setups.db ict-paper-state/setups.db
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ict-paper/data.json ict-paper-state/setups.db
          git diff --cached --quiet || git commit -m 'update ICT paper account'
          git push
