name: paper-trading

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub yoğunluğunda gecikebilir
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Testleri çalıştır
        run: |
          node test/paper_health.test.js
          node test/paper_trade_policy.test.js
          node test/paper_analytics.test.js
          node test/paper_state_validator.test.js
          node test/paper_state_backward_compat.test.js
          node test/validate_paper_state_cli.test.js
          node test/paper_summary.test.js
          node test/strategy_allocator.test.js

      - name: Kod sözdizimini doğrula
        run: |
          node --check paper_engine.js
          node --check paper_analytics.js
          node --check paper_health.js
          node --check core/paper_state_validator.js
          node --check core/paper_summary.js
          node --check core/strategy_allocator.js
          node --check scripts/validate_paper_state.js
          node --check scripts/build_paper_summary.js
          node --check scripts/build_strategy_allocation.js

      - name: Motoru çalıştır
        run: node paper_engine.js

      - name: Performans analitiğini üret
        run: node paper_analytics.js

      - name: V7 strateji tahsisini üret
        run: node scripts/build_strategy_allocation.js paper_state.json docs/strategy_allocation.json

      - name: State sağlığını ölç
        run: node paper_health.js

      - name: State, Pages kopyası ve V6 özetini üret
        run: |
          mkdir -p docs
          cp paper_state.json docs/paper_state.json
          node scripts/validate_paper_state.js --same paper_state.json docs/paper_state.json
          node scripts/build_paper_summary.js paper_state.json docs/paper_summary.json

      - name: Durumu güvenli biçimde commit'le
        run: |
          set -euo pipefail
          git config user.name "paper-bot"
          git config user.email "actions@github.com"

          cp paper_state.json /tmp/paper_state.json
          cp docs/paper_state.json /tmp/docs_paper_state.json
          cp docs/paper_summary.json /tmp/paper_summary.json
          cp docs/strategy_allocation.json /tmp/strategy_allocation.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/paper_state.json paper_state.json
            mkdir -p docs
            cp /tmp/docs_paper_state.json docs/paper_state.json
            cp /tmp/paper_summary.json docs/paper_summary.json
            cp /tmp/strategy_allocation.json docs/strategy_allocation.json
            git add paper_state.json docs/paper_state.json docs/paper_summary.json docs/strategy_allocation.json

            if git diff --cached --quiet; then
              echo "değişiklik yok"
              exit 0
            fi

            git commit -m "paper: V7 strateji tahsisi ve izlenebilirlik güncellendi [skip ci]"
            if git push origin HEAD:main; then
              echo "state push başarılı (deneme $attempt)"
              exit 0
            fi

            echo "push çakıştı; güncel main üzerine yeniden uygulanıyor ($attempt/3)"
            sleep $((attempt * 3))
          done

          echo "state üç denemede push edilemedi"
          exit 1
