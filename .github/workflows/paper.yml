name: paper-trading

on:
  schedule:
    - cron: '*/5 * * * *'   # ~5 dk'da bir (GitHub yoğunlukta geciktirebilir)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Motoru çalıştır
        run: node paper_engine.js

      - name: Performans analitiğini üret
        run: node paper_analytics.js

      - name: State sağlığını ölç
        run: node paper_health.js

      - name: State dosyasını doğrula ve Pages'a kopyala
        run: |
          node -e "const fs=require('fs');const p='paper_state.json';const raw=fs.readFileSync(p,'utf8').trim();if(!raw)throw new Error('paper_state.json boş');const s=JSON.parse(raw);if(!Array.isArray(s.open)||!Array.isArray(s.closed))throw new Error('paper_state.json şeması geçersiz');if(!s.health||!s.health.status)throw new Error('state sağlık sonucu eksik');console.log('state doğrulandı:',s.closed.length,'kapalı,',s.open.length,'açık işlem, sağlık',s.health.status);"
          mkdir -p docs
          cp paper_state.json docs/paper_state.json
          node -e "const s=JSON.parse(require('fs').readFileSync('docs/paper_state.json','utf8'));if(!s.health)throw new Error('docs state sağlık sonucu eksik');console.log('docs/paper_state.json doğrulandı');"

      - name: Durumu commit'le
        run: |
          git config user.name "paper-bot"
          git config user.email "actions@github.com"
          git add paper_state.json docs/paper_state.json
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "paper: durum ve analitik güncellendi [skip ci]"
          git pull --rebase origin main || true
          git push
