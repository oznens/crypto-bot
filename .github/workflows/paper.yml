name: paper-trading

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub yoğunluğunda gecikebilir
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testleri çalıştır
        run: |
          node test/paper_health.test.js
          node test/paper_trade_policy.test.js
          node test/paper_analytics.test.js
          node test/paper_state_validator.test.js

      - name: Kod sözdizimini doğrula
        run: |
          node --check paper_engine.js
          node --check paper_analytics.js
          node --check paper_health.js
          node --check core/paper_state_validator.js

      - name: Motoru çalıştır
        run: node paper_engine.js

      - name: Performans analitiğini üret
        run: node paper_analytics.js

      - name: State sağlığını ölç
        run: node paper_health.js

      - name: State kalite kapısı
        run: |
          node -e "const fs=require('fs');const V=require('./core/paper_state_validator');const s=JSON.parse(fs.readFileSync('paper_state.json','utf8'));V.assertState(s,{analyticsVersion:'5.5'});console.log('state doğrulandı:',s.closed.length,'kapalı,',s.open.length,'açık işlem, sağlık',s.health.status,'analytics',s.analyticsMeta.version);"

      - name: Pages state kopyasını doğrula
        run: |
          mkdir -p docs
          cp paper_state.json docs/paper_state.json
          node -e "const fs=require('fs');const V=require('./core/paper_state_validator');const s=JSON.parse(fs.readFileSync('docs/paper_state.json','utf8'));V.assertState(s,{analyticsVersion:'5.5'});console.log('docs/paper_state.json doğrulandı');"

      - name: Durumu güvenli biçimde commit'le
        run: |
          set -euo pipefail
          git config user.name "paper-bot"
          git config user.email "actions@github.com"

          cp paper_state.json /tmp/paper_state.json
          cp docs/paper_state.json /tmp/docs_paper_state.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/paper_state.json paper_state.json
            mkdir -p docs
            cp /tmp/docs_paper_state.json docs/paper_state.json
            git add paper_state.json docs/paper_state.json

            if git diff --cached --quiet; then
              echo "değişiklik yok"
              exit 0
            fi

            git commit -m "paper: durum, analitik ve sağlık güncellendi [skip ci]"
            if git push origin HEAD:main; then
              echo "state push başarılı (deneme $attempt)"
              exit 0
            fi

            echo "push çakıştı; güncel main üzerine yeniden uygulanıyor ($attempt/3)"
            sleep $((attempt * 3))
          done

          echo "state üç denemede push edilemedi"
          exit 1
