name: paper-trading

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub yoğunluğunda gecikebilir
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sağlık testlerini çalıştır
        run: node test/paper_health.test.js

      - name: İşlem politikası testlerini çalıştır
        run: node test/paper_trade_policy.test.js

      - name: Analitik testlerini çalıştır
        run: node test/paper_analytics.test.js

      - name: Kod sözdizimini doğrula
        run: |
          node --check paper_engine.js
          node --check paper_analytics.js
          node --check paper_health.js

      - name: Motoru çalıştır
        run: node paper_engine.js

      - name: Performans analitiğini üret
        run: node paper_analytics.js

      - name: State sağlığını ölç
        run: node paper_health.js

      - name: Sağlık kalite kapısı
        run: |
          node -e "const s=JSON.parse(require('fs').readFileSync('paper_state.json','utf8'));const h=s.health;if(!h)throw new Error('state sağlık sonucu eksik');console.log('sağlık:',h.status,'state yaşı:',h.stateAgeMinutes,'dk','analitik yaşı:',h.analyticsAgeMinutes,'dk');if(!h.ok||h.status!=='HEALTHY')throw new Error('paper state sağlıksız: '+(h.issues||[]).join(','));"

      - name: State dosyasını doğrula ve Pages'a kopyala
        run: |
          node -e "const fs=require('fs');const p='paper_state.json';const raw=fs.readFileSync(p,'utf8').trim();if(!raw)throw new Error('paper_state.json boş');const s=JSON.parse(raw);if(!Array.isArray(s.open)||!Array.isArray(s.closed))throw new Error('paper_state.json şeması geçersiz');if(!s.health||!s.health.status)throw new Error('state sağlık sonucu eksik');if(!s.analyticsMeta||s.analyticsMeta.version!=='5.5')throw new Error('analytics sürümü geçersiz');console.log('state doğrulandı:',s.closed.length,'kapalı,',s.open.length,'açık işlem, sağlık',s.health.status,'analytics',s.analyticsMeta.version);"
          mkdir -p docs
          cp paper_state.json docs/paper_state.json
          node -e "const s=JSON.parse(require('fs').readFileSync('docs/paper_state.json','utf8'));if(!s.health)throw new Error('docs state sağlık sonucu eksik');if(!s.analyticsMeta||s.analyticsMeta.version!=='5.5')throw new Error('docs analytics sürümü geçersiz');console.log('docs/paper_state.json doğrulandı');"

      - name: Durumu güvenli biçimde commit'le
        run: |
          set -euo pipefail
          git config user.name "paper-bot"
          git config user.email "actions@github.com"

          cp paper_state.json /tmp/paper_state.json
          cp docs/paper_state.json /tmp/docs_paper_state.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/paper_state.json paper_state.json
            mkdir -p docs
            cp /tmp/docs_paper_state.json docs/paper_state.json
            git add paper_state.json docs/paper_state.json

            if git diff --cached --quiet; then
              echo "değişiklik yok"
              exit 0
            fi

            git commit -m "paper: durum, analitik ve sağlık güncellendi [skip ci]"
            if git push origin HEAD:main; then
              echo "state push başarılı (deneme $attempt)"
              exit 0
            fi

            echo "push çakıştı; güncel main üzerine yeniden uygulanıyor ($attempt/3)"
            sleep $((attempt * 3))
          done

          echo "state üç denemede push edilemedi"
          exit 1
