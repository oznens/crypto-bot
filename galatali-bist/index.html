<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galatalı Metodu BIST Tarayıcı</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0b0d10;color:#f3f5f7}.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:#9ca3af}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:18px}.card{background:#14181d;border:1px solid #242a31;border-radius:14px;padding:14px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#222831;font-size:12px;margin-right:6px}.good{color:#86efac}.warn{color:#fde68a}.bad{color:#fca5a5}.row{display:flex;justify-content:space-between;gap:10px;margin:6px 0}.v{font-weight:700}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.filters button{background:#1d232b;color:#fff;border:1px solid #303844;padding:8px 11px;border-radius:10px}.filters button.active{background:#fff;color:#111}.empty{padding:30px;text-align:center;border:1px dashed #333;border-radius:12px;margin-top:18px}</style></head><body><div class="wrap"><div class="top"><div><h1>Galatalı Metodu — BIST Tarayıcı</h1><div id="meta" class="muted">Veri yükleniyor…</div></div><a href="../" style="color:#fff">Ana sayfa</a></div><div class="filters"><button data-f="all" class="active">Tümü</button><button data-f="aktif-takip">Aktif</button><button data-f="doğru maliyet bekle">Doğru maliyet</button><button data-f="hedefe yakın-kovalama">Hedefe yakın</button><button data-f="tamamlandı-kâr koru">Tamamlandı</button></div><div id="grid" class="grid"></div><div id="empty" class="empty" style="display:none">Henüz tarama sonucu oluşmadı. GitHub Actions ilk çalışmayı tamamlayınca burada görünecek.</div></div><script>let DATA=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function cls(s){return s.includes('aktif')?'good':s.includes('yakın')?'warn':s.includes('tamamlandı')?'bad':''}function render(f='all'){const g=document.getElementById('grid');const a=f==='all'?DATA:DATA.filter(x=>x.status===f);g.innerHTML=a.slice(0,80).map(x=>`<div class="card"><div><span class="tag">${esc(x.symbol)}</span><span class="tag">${esc(x.timeframe)}</span><span class="tag">${esc(x.pattern)}</span></div><h3 class="${cls(x.status)}">${esc(x.status)}</h3><div class="row"><span>Yön</span><span class="v">${esc(x.direction)}</span></div><div class="row"><span>Güven</span><span class="v">${esc(x.confidence)}/100</span></div><div class="row"><span>Fiyat</span><span class="v">${esc(x.last)}</span></div><div class="row"><span>D / PRZ</span><span class="v">${Number(x.d).toFixed(2)}</span></div><div class="row"><span>Invalidasyon</span><span class="v">${esc(x.invalid)}</span></div><div class="row"><span>Hedef 1</span><span class="v">${esc(x.target1)}</span></div><div class="row"><span>Hedef 2</span><span class="v">${esc(x.target2)}</span></div><div class="row"><span>H2 kalan</span><span class="v">%${esc(x.potential_to_t2_pct)}</span></div><div class="muted" style="margin-top:8px">Hedef ilerleme: %${esc(x.progress_pct)} · D tarihi: ${esc(x.d_date)}</div></div>`).join('');document.getElementById('empty').style.display=a.length?'none':'block'}fetch('../data/galatali_bist/scan.json?ts='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{DATA=j.findings||[];document.getElementById('meta').textContent=`${new Date(j.generated_at).toLocaleString('tr-TR')} · ${j.universe} hisse · ${DATA.length} aday`;render()}).catch(()=>{document.getElementById('meta').textContent='İlk tarama sonucu bekleniyor';document.getElementById('empty').style.display='block'});document.querySelectorAll('button[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.f)});</script></body></html>
