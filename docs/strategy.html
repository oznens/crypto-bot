<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DREYKO V33 Strateji Operasyonları</title>
<style>
:root{--bg:#0b0e13;--panel:#12161e;--line:#2c3442;--text:#e6edf3;--dim:#8b949e;--g:#5fd99a;--r:#f08a8a;--y:#e8c34a;--b:#79c0ff}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}h1{font-size:21px;margin:0 0 5px}.sub{color:var(--dim);margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px}.k{font-size:11px;color:var(--dim)}.v{font-size:18px;font-weight:bold;margin-top:4px;overflow:hidden;text-overflow:ellipsis}.section{font-size:15px;margin:20px 0 8px;color:#c9d1d9}.wrap{overflow:auto;margin-bottom:18px}table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{font-size:10px;color:var(--dim);text-transform:uppercase}th:first-child,td:first-child{text-align:left}.tag{font-size:10px;font-weight:bold;padding:3px 7px;border-radius:5px}.ACTIVE,.CHAMPION,.READY{color:var(--g);background:#16372a}.WATCH,.CHALLENGER,.SHADOW{color:var(--y);background:#3b3215}.PAUSED,.REJECTED,.BLOCKED{color:var(--r);background:#3a1c20}.UNRANKED{color:var(--b);background:#172f42}.g{color:var(--g)}.r{color:var(--r)}.b{color:var(--b)}.y{color:var(--y)}</style></head>
<body><h1>🧠 DREYKO V33 — Strateji Operasyon Merkezi</h1><div class="sub" id="sub">yükleniyor…</div>
<div class="section">Canlı Güvenlik ve Yürütme</div><div class="cards" id="ops"></div>
<div class="section">Strateji Tahsisi ve Dayanıklılık</div><div class="cards" id="allocCards"></div><div class="wrap"><table><thead><tr><th>Model</th><th>Durum</th><th>Skor</th><th>İşlem</th><th>Beklenti</th><th>PF</th><th>Max DD</th><th>Decay</th><th>Monte Carlo</th><th>Kararlılık</th><th>Risk</th><th>Pay</th><th>Gerekçe</th></tr></thead><tbody id="allocRows"></tbody></table></div>
<div class="section">Champion–Challenger İnkübasyonu</div><div class="cards" id="incCards"></div><div class="wrap"><table><thead><tr><th>Model</th><th>Statü</th><th>İşlem</th><th>Win Rate</th><th>Beklenti</th><th>Toplam R</th><th>Max DD</th><th>Gerekçe</th></tr></thead><tbody id="incRows"></tbody></table></div>
<script>
const f=(v,d=2)=>Number(v||0).toFixed(d);const card=(k,v,c='')=>`<div class="card"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;async function json(name){const r=await fetch(name+'?t='+Date.now());if(!r.ok)throw new Error(name+' yok');return r.json();}
async function load(){try{const [a,st,inc]=await Promise.all([json('strategy_allocation.json'),json('paper_state.json'),json('strategy_incubator.json')]);const e=st.strategyExecution||{},x=st.strategyContextExecution||{},cb=st.circuitBreaker||{},q=x.lastDataQuality||{},corr=x.lastCorrelation||{},ctx=x.lastContext||{};document.getElementById('sub').textContent=`Tahsis ${a.version} · context ${x.version||'—'} · inkübasyon ${inc.version} · ${new Date(a.generatedAt).toLocaleString('tr-TR')}`;document.getElementById('ops').innerHTML=[card('Circuit Breaker',cb.blocked?'BLOKE':'AÇIK',cb.blocked?'r':'g'),card('Günlük Sonuç',f(cb.dailyR)+'R',cb.dailyR<0?'r':'g'),card('Kayıp Serisi',cb.losingStreak||0,cb.losingStreak>=3?'r':''),card('Veri Kalitesi',q.score==null?'—':q.score+'/100',q.valid===false?'r':'g'),card('Context Kabul',`${x.contextAccepted||0}/${x.contextEvaluated||0}`,'b'),card('Korelasyon Engeli',x.correlationBlocked||0,x.correlationBlocked?'r':''),card('Azaltılmış Risk',e.reducedRisk||0,'y'),card('Adaptif Stop',x.adaptiveChanged||0,'g'),card('Son Rejim/Model',`${ctx.mmxm?.phase||'—'} / ${e.lastDecision?.model||'—'}`,'b'),card('Son Net RR',ctx.executionCost?.netRR==null?'—':f(ctx.executionCost.netRR)+'R',ctx.executionCost?.valid===false?'r':'g'),card('Son Korelasyon',corr.reason||'—',corr.valid===false?'r':'b'),card('Son Çıkış',x.lastExit?.reason||'—','b')].join('');document.getElementById('allocCards').innerHTML=[card('Aktif',a.activeCount,'g'),card('İzleme',a.watchCount,'y'),card('Durdurulan',a.pausedCount,'r'),card('Toplam Model',a.allocations.length,'b')].join('');document.getElementById('allocRows').innerHTML=a.allocations.map(s=>`<tr><td><b>${s.model}</b></td><td><span class="tag ${s.status}">${s.status}</span></td><td>${s.score}</td><td>${s.trades}</td><td class="${s.expectancy>=0?'g':'r'}">${f(s.expectancy,3)}R</td><td>${f(s.profitFactor)}</td><td>${f(s.maxDrawdownR)}R</td><td>${s.decay?.status||'—'}</td><td>${s.robustness?.status||'—'}${s.robustness?.lossProbability!=null?' · '+f(100*s.robustness.lossProbability,1)+'%':''}</td><td>${s.stability?.status||'—'}</td><td>${f(s.riskMultiplier)}×</td><td>${f(s.portfolioWeightPct)}%</td><td>${s.reason}</td></tr>`).join('');document.getElementById('incCards').innerHTML=[card('Champion',inc.champions.length,'g'),card('Promotion Ready',inc.ready.length,'g'),card('Challenger/Shadow',inc.challengers.length,'y'),card('Reddedilen',inc.rejected.length,'r')].join('');document.getElementById('incRows').innerHTML=inc.strategies.map(s=>`<tr><td><b>${s.model}</b></td><td><span class="tag ${s.status}">${s.status}</span></td><td>${s.trades}</td><td>${f(s.winRate,1)}%</td><td class="${s.expectancy>=0?'g':'r'}">${f(s.expectancy,3)}R</td><td>${f(s.totalR)}R</td><td>${f(s.maxDrawdownR)}R</td><td>${s.reason}</td></tr>`).join('');}catch(e){document.getElementById('sub').textContent='V33 raporu henüz üretilmedi: '+e.message;}}
load();setInterval(load,60000);
</script></body></html>
