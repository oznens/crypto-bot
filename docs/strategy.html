<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DREYKO V7 Strateji Tahsisi</title>
<style>
:root{--bg:#0b0e13;--panel:#12161e;--line:#2c3442;--text:#e6edf3;--dim:#8b949e;--g:#5fd99a;--r:#f08a8a;--y:#e8c34a;--b:#79c0ff}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}h1{font-size:20px;margin:0 0 5px}.sub{color:var(--dim);margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px}.k{font-size:11px;color:var(--dim)}.v{font-size:20px;font-weight:bold;margin-top:4px}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{font-size:10px;color:var(--dim);text-transform:uppercase}th:first-child,td:first-child{text-align:left}.tag{font-size:10px;font-weight:bold;padding:3px 7px;border-radius:5px}.ACTIVE{color:var(--g);background:#16372a}.WATCH{color:var(--y);background:#3b3215}.PAUSED{color:var(--r);background:#3a1c20}.g{color:var(--g)}.r{color:var(--r)}.b{color:var(--b)}</style></head>
<body><h1>⚖️ DREYKO V7 — Strateji Kalite ve Risk Tahsisi</h1><div class="sub" id="sub">yükleniyor…</div><div class="cards" id="cards"></div><div class="wrap"><table><thead><tr><th>Model</th><th>Durum</th><th>Skor</th><th>İşlem</th><th>Beklenti</th><th>PF</th><th>Max DD</th><th>WF</th><th>Risk Çarpanı</th><th>Portföy Payı</th><th>Gerekçe</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
const f=(v,d=2)=>Number(v||0).toFixed(d);async function load(){try{const r=await fetch('strategy_allocation.json?t='+Date.now());if(!r.ok)throw new Error('rapor yok');const x=await r.json();document.getElementById('sub').textContent='Şema '+x.version+' · '+new Date(x.generatedAt).toLocaleString('tr-TR')+' · minimum örneklem '+x.minTrades;document.getElementById('cards').innerHTML=[['Aktif',x.activeCount,'g'],['İzleme',x.watchCount,''],['Durdurulan',x.pausedCount,'r'],['Toplam Model',x.allocations.length,'b']].map(c=>`<div class="card"><div class="k">${c[0]}</div><div class="v ${c[2]}">${c[1]}</div></div>`).join('');document.getElementById('rows').innerHTML=x.allocations.map(a=>`<tr><td><b>${a.model}</b></td><td><span class="tag ${a.status}">${a.status}</span></td><td>${a.score}</td><td>${a.trades}</td><td class="${a.expectancy>=0?'g':'r'}">${f(a.expectancy,3)}R</td><td>${f(a.profitFactor)}</td><td>${f(a.maxDrawdownR)}R</td><td>${a.walkForward&&a.walkForward.robust?'✓':'—'}</td><td>${f(a.riskMultiplier)}×</td><td>${f(a.portfolioWeightPct)}%</td><td>${a.reason}</td></tr>`).join('');}catch(e){document.getElementById('sub').textContent='V7 raporu henüz üretilmedi: '+e.message;}}load();setInterval(load,60000);
</script></body></html>
