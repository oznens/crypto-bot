<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DREYKO V8 Strateji Yürütmesi</title>
<style>
:root{--bg:#0b0e13;--panel:#12161e;--line:#2c3442;--text:#e6edf3;--dim:#8b949e;--g:#5fd99a;--r:#f08a8a;--y:#e8c34a;--b:#79c0ff}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}h1{font-size:20px;margin:0 0 5px}.sub{color:var(--dim);margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px}.k{font-size:11px;color:var(--dim)}.v{font-size:20px;font-weight:bold;margin-top:4px}.section{font-size:14px;margin:18px 0 8px;color:#c9d1d9}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{font-size:10px;color:var(--dim);text-transform:uppercase}th:first-child,td:first-child{text-align:left}.tag{font-size:10px;font-weight:bold;padding:3px 7px;border-radius:5px}.ACTIVE{color:var(--g);background:#16372a}.WATCH{color:var(--y);background:#3b3215}.PAUSED{color:var(--r);background:#3a1c20}.UNRANKED{color:var(--b);background:#172f42}.g{color:var(--g)}.r{color:var(--r)}.b{color:var(--b)}.y{color:var(--y)}</style></head>
<body><h1>⚖️ DREYKO V8 — Strateji Tahsisi ve Gerçek Yürütme</h1><div class="sub" id="sub">yükleniyor…</div><div class="cards" id="exec"></div><div class="section">V7 Strateji Tahsisi</div><div class="cards" id="cards"></div><div class="wrap"><table><thead><tr><th>Model</th><th>Durum</th><th>Skor</th><th>İşlem</th><th>Beklenti</th><th>PF</th><th>Max DD</th><th>WF</th><th>Risk Çarpanı</th><th>Portföy Payı</th><th>Gerekçe</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
const f=(v,d=2)=>Number(v||0).toFixed(d);const card=(k,v,c='')=>`<div class="card"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;
async function json(name){const r=await fetch(name+'?t='+Date.now());if(!r.ok)throw new Error(name+' yok');return r.json();}
async function load(){try{const [x,st]=await Promise.all([json('strategy_allocation.json'),json('paper_state.json')]);const e=st.strategyExecution||{};document.getElementById('sub').textContent='Tahsis '+x.version+' · yürütme '+(e.version||'bekleniyor')+' · '+new Date(x.generatedAt).toLocaleString('tr-TR')+' · minimum örneklem '+x.minTrades;document.getElementById('exec').innerHTML=[card('Değerlendirilen',e.evaluated||0,'b'),card('İzin Verilen',e.allowed||0,'g'),card('PAUSED Engeli',e.paused||0,'r'),card('Azaltılmış Risk',e.reducedRisk||0,'y'),card('Artırılmış Risk',e.increasedRisk||0,'g'),card('Son Model',e.lastDecision?`${e.lastDecision.model} · ${f(e.lastDecision.multiplier)}×`:'—','b')].join('');document.getElementById('cards').innerHTML=[card('Aktif',x.activeCount,'g'),card('İzleme',x.watchCount,'y'),card('Durdurulan',x.pausedCount,'r'),card('Toplam Model',x.allocations.length,'b')].join('');document.getElementById('rows').innerHTML=x.allocations.map(a=>`<tr><td><b>${a.model}</b></td><td><span class="tag ${a.status}">${a.status}</span></td><td>${a.score}</td><td>${a.trades}</td><td class="${a.expectancy>=0?'g':'r'}">${f(a.expectancy,3)}R</td><td>${f(a.profitFactor)}</td><td>${f(a.maxDrawdownR)}R</td><td>${a.walkForward&&a.walkForward.robust?'✓':'—'}</td><td>${f(a.riskMultiplier)}×</td><td>${f(a.portfolioWeightPct)}%</td><td>${a.reason}</td></tr>`).join('');}catch(e){document.getElementById('sub').textContent='V8 raporu henüz üretilmedi: '+e.message;}}
load();setInterval(load,60000);
</script></body></html>
