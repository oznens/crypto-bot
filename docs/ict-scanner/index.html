<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICT TS+ · MSS · OB · IFVG Scanner</title>
<script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--red:#e34b4b;--blue:#2563eb;--green:#0f9f6e;--amber:#b7791f;--gray:#9ca3af}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1600px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:14px;justify-content:space-between;margin-bottom:14px}.title{font-size:22px;font-weight:800}.sub{color:var(--muted);font-size:12px;margin-top:4px}.badge{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px}.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:14px}.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 9px #00000008}.left{height:calc(100vh - 105px);overflow:auto}.filters{position:sticky;top:0;background:#fff;z-index:3;padding:12px;border-bottom:1px solid var(--line)}input,select{border:1px solid var(--line);border-radius:8px;padding:9px;background:white}.filters input{width:100%;margin-bottom:8px}.row{display:flex;gap:8px}.row select{width:50%}.cards{padding:8px}.card{padding:11px;margin-bottom:7px;border:1px solid var(--line);border-radius:9px;cursor:pointer}.card:hover,.card.active{border-color:#9ca3af;background:#fafafa}.cardTop{display:flex;justify-content:space-between;gap:8px}.sym{font-weight:800}.score{font-weight:800}.side.SHORT{color:var(--red)}.side.LONG{color:var(--green)}.stage{font-size:12px;color:var(--muted);margin-top:5px}.dots{height:5px;background:#eee;border-radius:9px;overflow:hidden;margin-top:7px}.dots i{display:block;height:100%;background:#111;width:0}.main{padding:14px;min-width:0}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:8px}.hero h2{margin:0;font-size:20px}.heroMeta{text-align:right;font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:14px}.chartWrap{position:relative;height:620px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}#chart{position:absolute;inset:0}.zone{position:absolute;pointer-events:none;z-index:2;border-radius:2px}.zone.ob{background:#8b8b8b25;border-top:1px solid #b7b7b7}.zone.ifvg{background:#7f7f7f2d}.zone.overlap{background:#e34b4b14}.sidePanel{border-left:1px solid var(--line);padding-left:14px}.checks{display:grid;gap:7px}.check{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f0f0;padding:6px 0}.ok{color:var(--green);font-weight:800}.wait{color:#9ca3af}.levels{margin-top:14px}.lev{display:grid;grid-template-columns:1fr auto;gap:10px;padding:5px 0;font-size:12px}.lev span:first-child{color:var(--muted)}.grade{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:30px;border-radius:7px;font-weight:900;background:#111;color:white}.grade.ap{background:#067647}.grade.a{background:#137c8b}.grade.b{background:#b7791f}.invalid{background:#b42318!important}.note{margin-top:14px;font-size:11px;line-height:1.5;color:var(--muted);background:#fafafa;padding:9px;border-radius:8px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:8px 0 0}.lg:before{content:'';display:inline-block;width:18px;height:7px;margin-right:5px}.lg.ob:before{background:#8884}.lg.ifvg:before{background:#6665}.lg.cisd:before{height:2px;background:var(--red)}.lg.tp:before{height:2px;background:var(--blue)}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:950px){.wrap{padding:8px}.layout{grid-template-columns:1fr}.left{height:auto;max-height:390px}.grid{grid-template-columns:1fr}.chartWrap{height:500px}.sidePanel{border-left:0;border-top:1px solid var(--line);padding:12px 0 0}.title{font-size:18px}}@media(min-width:1500px){.chartWrap{height:720px}}
</style>
</head>
<body><div class="wrap"><div class="top"><div><div class="title">ICT Staged Scanner</div><div class="sub">TS+ → MSS → OB → IFVG → Retracement → CISD → Entry → Liquidity TP</div></div><div id="updated" class="badge">Veri yükleniyor…</div></div><div class="layout"><aside class="panel left"><div class="filters"><input id="q" placeholder="Parite ara…"><div class="row"><select id="side"><option value="">Tüm yönler</option><option>SHORT</option><option>LONG</option></select><select id="grade"><option value="">Tüm notlar</option><option>A+</option><option>A</option><option>B</option><option>WATCH</option></select></div></div><div id="cards" class="cards"></div></aside><main class="panel main"><div id="detail" class="empty">Bir setup seçiliyor…</div></main></div></div>
<script>
let DATA=null, selected=null, chart=null, candleSeries=null, overlays=[];
const $=s=>document.querySelector(s), fmt=x=>x==null?'—':(+x).toLocaleString('en-US',{maximumFractionDigits:8});
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function filtered(){const q=$('#q').value.trim().toUpperCase(),side=$('#side').value,grade=$('#grade').value;return DATA.results.filter(x=>(!q||x.symbol.includes(q))&&(!side||x.side===side)&&(!grade||x.grade===grade))}
function cards(){const list=filtered();$('#cards').innerHTML=list.map(x=>`<div class="card ${selected===x.symbol?'active':''}" data-sym="${x.symbol}"><div class="cardTop"><div><span class="sym">${x.symbol}</span> <span class="side ${x.side||''}">${x.side||'—'}</span></div><span class="score">${x.score}/8</span></div><div class="stage">${esc(x.stage.label)} · ${x.grade}</div><div class="dots"><i style="width:${x.score/8*100}%"></i></div></div>`).join('')||'<div class="empty">Filtreye uygun setup yok.</div>';document.querySelectorAll('.card').forEach(el=>el.onclick=()=>select(el.dataset.sym));}
function gradeClass(x){return x==='A+'?'ap':x==='A'?'a':x==='B'?'b':''}
function select(sym){selected=sym;cards();const x=DATA.results.find(r=>r.symbol===sym);if(!x)return;render(x)}
function line(series,price,title,color,style=0){if(price==null)return;series.createPriceLine({price,color,lineWidth:1,lineStyle:style,axisLabelVisible:true,title})}
function clearOverlays(){overlays.forEach(x=>x.remove());overlays=[]}
function zone(cls,z,fromTime,toTime){if(!z||!chart||!candleSeries)return;const host=$('.chartWrap');const el=document.createElement('div');el.className='zone '+cls;host.appendChild(el);overlays.push(el);const place=()=>{const x1=chart.timeScale().timeToCoordinate(fromTime),x2=chart.timeScale().timeToCoordinate(toTime),y1=candleSeries.priceToCoordinate(z.high),y2=candleSeries.priceToCoordinate(z.low);if([x1,x2,y1,y2].some(v=>v==null)){el.style.display='none';return}el.style.display='block';el.style.left=Math.max(0,x1)+'px';el.style.width=Math.max(2,x2-x1)+'px';el.style.top=Math.min(y1,y2)+'px';el.style.height=Math.abs(y2-y1)+'px'};place();chart.timeScale().subscribeVisibleTimeRangeChange(place);window.addEventListener('resize',place,{once:true})}
function render(x){if(chart){chart.remove();chart=null}$('#detail').className='';$('#detail').innerHTML=`<div class="hero"><div><h2>${x.symbol} <span class="side ${x.side||''}">${x.side||'WAIT'}</span></h2><div class="sub">${esc(x.stage.label)}</div></div><div class="heroMeta"><span class="grade ${gradeClass(x.grade)} ${x.stage.key==='INVALIDATED'?'invalid':''}">${x.stage.key==='INVALIDATED'?'X':x.grade}</span><div style="margin-top:5px">${fmt(x.price)} USDT · ${x.score}/8</div></div></div><div class="grid"><div><div class="chartWrap"><div id="chart"></div></div><div class="legend"><span class="lg ob">OB</span><span class="lg ifvg">IFVG</span><span class="lg cisd">CISD / MSS</span><span class="lg tp">Sell/Buy-side</span></div></div><aside class="sidePanel"><div class="checks">${x.checks.map(c=>`<div class="check"><span>${esc(c.label)}</span><b class="${c.ok?'ok':'wait'}">${c.ok?'✓':'○'}</b></div>`).join('')}</div><div class="levels"><div class="lev"><span>TS seviyesi</span><b>${fmt(x.levels.sweep)}</b></div><div class="lev"><span>MSS</span><b>${fmt(x.levels.mss)}</b></div><div class="lev"><span>OB</span><b>${x.levels.ob?fmt(x.levels.ob.low)+' – '+fmt(x.levels.ob.high):'—'}</b></div><div class="lev"><span>IFVG</span><b>${x.levels.ifvg?fmt(x.levels.ifvg.low)+' – '+fmt(x.levels.ifvg.high):'—'}</b></div><div class="lev"><span>CISD</span><b>${fmt(x.levels.cisd)}</b></div><div class="lev"><span>Plan giriş</span><b>${fmt(x.levels.entry)}</b></div><div class="lev"><span>Invalidation / SL</span><b>${fmt(x.levels.invalidation)}</b></div><div class="lev"><span>Liquidity TP</span><b>${fmt(x.levels.target)}</b></div><div class="lev"><span>Plan RR</span><b>${x.levels.rr?x.levels.rr+'R':'—'}</b></div></div><div class="note">CISD dahil kurallar mekanik yaklaşımdır; ICT kavramlarının tek evrensel matematiksel tanımı yoktur. Bot kapanmış mumlarla yapı onayı verir; bu ekran emir göndermez.</div></aside></div>`;
const host=$('#chart');chart=LightweightCharts.createChart(host,{layout:{background:{color:'#ffffff'},textColor:'#374151'},grid:{vertLines:{color:'#f0f1f3'},horzLines:{color:'#f0f1f3'}},rightPriceScale:{borderColor:'#e5e7eb'},timeScale:{borderColor:'#e5e7eb',timeVisible:true},crosshair:{mode:0}});candleSeries=chart.addCandlestickSeries({upColor:'#fff',downColor:'#111',borderUpColor:'#111',borderDownColor:'#111',wickUpColor:'#555',wickDownColor:'#555'});const cc=x.candles4h.map(k=>({time:k[0],open:k[1],high:k[2],low:k[3],close:k[4]}));candleSeries.setData(cc);const marks=[];if(x.events.sweep)marks.push({time:Math.floor(x.events.sweep.time/1000),position:x.side==='SHORT'?'aboveBar':'belowBar',color:'#111',shape:x.side==='SHORT'?'arrowDown':'arrowUp',text:'TS+'});if(x.events.mss)marks.push({time:Math.floor(x.events.mss.time/1000),position:x.side==='SHORT'?'aboveBar':'belowBar',color:'#e34b4b',shape:'circle',text:'MSS'});candleSeries.setMarkers(marks.sort((a,b)=>a.time-b.time));line(candleSeries,x.levels.mss,'MSS','#e34b4b',2);line(candleSeries,x.levels.cisd,'CISD','#e34b4b',0);line(candleSeries,x.levels.target,x.side==='SHORT'?'Sellside':'Buyside','#2563eb',0);line(candleSeries,x.levels.invalidation,'TS+','#111',2);if(cc.length){const first=cc[Math.max(0,cc.length-55)].time,last=cc[cc.length-1].time;clearOverlays();if(x.levels.ob)zone('ob',x.levels.ob,Math.floor(x.levels.ob.time/1000),last);if(x.levels.ifvg)zone('ifvg',x.levels.ifvg,Math.floor(x.levels.ifvg.time/1000),last);if(x.levels.overlap)zone('overlap',x.levels.overlap,first,last)}chart.timeScale().fitContent();}
async function boot(){try{const r=await fetch('./data.json?'+Date.now(),{cache:'no-store'});DATA=await r.json();$('#updated').textContent=`${DATA.source} · ${new Date(DATA.generatedAt).toLocaleString('tr-TR')} · ${DATA.universe.scanned} parite`;cards();const best=DATA.results.find(x=>x.stage.key==='ENTRY_READY')||DATA.results[0];if(best)select(best.symbol)}catch(e){$('#updated').textContent='Veri okunamadı';$('#cards').innerHTML='<div class="empty">data.json henüz üretilmemiş. Workflow ilk taramayı tamamladığında burası dolacak.</div>'}}
$('#q').oninput=cards;$('#side').onchange=cards;$('#grade').onchange=cards;boot();setInterval(boot,5*60*1000);
</script></body></html>
