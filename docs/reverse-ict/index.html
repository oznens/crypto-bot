<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reverse ICT Scanner</title><link rel="stylesheet" href="markers.css"><style>
:root{color-scheme:dark;--bg:#090d14;--panel:#111823;--muted:#8b98aa;--line:#243043;--up:#4ade80;--down:#fb7185;--text:#e8eef7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui}.wrap{max-width:1180px;margin:auto;padding:20px}.top,.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top{margin-bottom:18px}h1{margin:0;font-size:clamp(25px,4vw,38px)}.muted{color:var(--muted)}.grid{display:grid;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.sym,.score{font-size:21px;font-weight:900}.buy{color:var(--up)}.sell{color:var(--down)}.chartbox{height:clamp(290px,43vw,440px);margin:14px 0;background:#080d14;border:1px solid var(--line);border-radius:12px;overflow:hidden}.chart{width:100%;height:100%;display:block}.details{display:grid;grid-template-columns:minmax(250px,.75fr) minmax(300px,1.25fr);gap:14px}.levels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.lv{padding:9px;background:#0b111a;border:1px solid var(--line);border-radius:9px}.lv b{display:block;font-size:11px;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:5px}.pill{border:1px solid var(--line);border-radius:7px;padding:2px 6px;font-size:11px}.ok{border-color:#265c3b;color:#a7f3d0}.off{opacity:.4}.reasons{margin:0;padding-left:20px}.empty{text-align:center;padding:40px}@media(max-width:700px){.wrap{padding:12px}.card{padding:12px}.details{grid-template-columns:1fr}.chartbox{height:330px;margin-left:-4px;margin-right:-4px}.sym,.score{font-size:18px}}
</style></head><body><main class="wrap"><header class="top"><div><h1>Reverse ICT Scanner</h1><div class="muted">BTC · ETH · XRP | D1/H4 → M15 | MEXC Futures public data</div></div><div id="updated" class="muted">Yükleniyor…</div></header><div id="grid" class="grid"></div></main><script>
const fmt=n=>n==null?'—':Number(n).toLocaleString('tr-TR',{maximumFractionDigits:8}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),chip=(s,on)=>`<span class="pill ${on?'ok':'off'}">${esc(s)}</span>`;
function marker(type,label,value){const present=value!=null&&value!=='—';return `<div class="marker ${type} ${present?'':'none'}"><b>${esc(label)}</b><span>${present?esc(value):'Tespit edilmedi'}</span></div>`}
function card(x,i){const b=x.scoreBreakdown||{},buy=x.side==='BUY',range=x.range?`${fmt(x.range.low)} – ${fmt(x.range.high)} · ${x.range.zone} (${fmt(x.range.pos)})`:null,marks=marker('bos','BOS',x.bos?`${fmt(x.bos.level)} · body close ${fmt(x.bos.close)}`:null)+marker('sweep','Likidite Sweep',x.sweep?`${fmt(x.sweep.level)} → uç ${fmt(x.sweep.extreme)}`:null)+marker('fvg','FVG',x.fvg?`${fmt(x.fvg.low)} – ${fmt(x.fvg.high)}`:null)+marker('ob','Order Block (OB)',x.ob?`${fmt(x.ob.low)} – ${fmt(x.ob.high)}`:null)+marker('ob','OB / FVG Kesişimi',x.obFvg?`${fmt(x.obFvg.low)} – ${fmt(x.obFvg.high)}`:null)+marker('msnr','MSNR / OCL',x.msnr?fmt(x.msnr.level):null)+marker('range','Dealing Range',range)+marker('range','ATR M15',fmt(x.atr15));return `<article class="card"><div class="head"><div><div class="sym">${esc(x.symbol)} <span class="${buy?'buy':'sell'}">${buy?'AL (BUY)':'SAT (SELL)'}</span></div><div class="muted">MEXC Futures · M15 · son ${(x.candles||[]).length} mum</div></div><div class="score">${x.confidence}/100</div></div><div class="chartbox"><canvas id="c${i}" class="chart" aria-label="${esc(x.symbol)} M15 mum grafiği"></canvas></div><div class="markers">${marks}</div><div class="details"><div><div class="levels">${[['Giriş',x.entry],['Stop Loss',x.sl],['TP1 · 2R',x.tp1],['TP2 · 4R',x.tp2]].map(v=>`<div class="lv"><b>${v[0]}</b>${fmt(v[1])}</div>`).join('')}</div><div class="muted">${esc(x.session)} · ${x.killZone?'Kill Zone':'Kill Zone dışı'} · ${esc(x.qt)}</div><div class="chips">${[['HTF +15',b.htf],['BOS +20',b.bos],['Sweep +15',b.sweep],['FVG +15',b.fvg],['OB +10',b.ob],['OB/FVG +5',b.obFvg],['MSNR +10',b.msnr],['KZ +10',b.killZone]].map(v=>chip(v[0],v[1]>0)).join('')}</div></div><ul class="reasons">${(x.reasoning||[]).map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div></article>`}
function draw(el,x){const a=x.candles||[];if(!el||!a.length)return;const r=el.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.max(300,r.width),h=Math.max(240,r.height),p={l:8,r:76,t:12,b:28};el.width=w*d;el.height=h*d;const c=el.getContext('2d');c.scale(d,d);const pw=w-p.l-p.r,ph=h-p.t-p.b,levels=[x.entry,x.sl,x.tp1,x.tp2,x.bos?.level,x.sweep?.level].filter(Number.isFinite),zs=[x.fvg,x.ob].filter(Boolean),ps=a.flatMap(k=>[k.high,k.low]).concat(levels,zs.flatMap(z=>[z.low,z.high])),lo=Math.min(...ps),hi=Math.max(...ps),m=(hi-lo||hi*.01)*.06,min=lo-m,max=hi+m,y=v=>p.t+(max-v)/(max-min)*ph,xx=i=>p.l+(i+.5)*pw/a.length;c.font='10px system-ui';c.strokeStyle='#182334';c.fillStyle='#8b98aa';for(let i=0;i<=4;i++){let yy=p.t+ph*i/4,v=max-(max-min)*i/4;c.beginPath();c.moveTo(p.l,yy);c.lineTo(w-p.r,yy);c.stroke();c.fillText(fmt(v),w-p.r+5,yy+3)}function zone(z,color,label){if(!z)return;let i=a.findIndex(k=>k.time>=z.time);if(i<0)i=0;c.fillStyle=color;c.fillRect(xx(i),y(z.high),w-p.r-xx(i),Math.max(2,y(z.low)-y(z.high)));c.fillStyle='#e9d5ff';c.fillText(label,xx(i)+3,y(z.high)+11)}zone(x.fvg,'#38bdf829','FVG');zone(x.ob,'#a855f729','OB');const cw=Math.max(1.5,pw/a.length*.64);a.forEach((k,i)=>{let col=k.close>=k.open?'#22c55e':'#f43f5e';c.strokeStyle=c.fillStyle=col;c.beginPath();c.moveTo(xx(i),y(k.high));c.lineTo(xx(i),y(k.low));c.stroke();let top=y(Math.max(k.open,k.close));c.fillRect(xx(i)-cw/2,top,cw,Math.max(1,y(Math.min(k.open,k.close))-top))});function line(v,col,label,dash=[]){if(!Number.isFinite(v))return;c.save();c.strokeStyle=c.fillStyle=col;c.setLineDash(dash);c.beginPath();c.moveTo(p.l,y(v));c.lineTo(w-p.r,y(v));c.stroke();c.setLineDash([]);c.font='bold 10px system-ui';c.fillText(label,w-p.r+5,y(v)-3);c.restore()}line(x.entry,'#38bdf8','ENTRY');line(x.sl,'#fb7185','SL');line(x.tp1,'#4ade80','TP1');line(x.tp2,'#a7f3d0','TP2');line(x.bos?.level,'#fbbf24','BOS',[4,3]);line(x.sweep?.level,'#fb923c','SWEEP',[2,3]);c.fillStyle='#8b98aa';c.font='10px system-ui';[0,Math.floor((a.length-1)/2),a.length-1].forEach((i,n)=>{c.textAlign=n===0?'left':n===2?'right':'center';c.fillText(new Date(a[i].time).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),xx(i),h-8)})}
let data=[];function paint(){data.forEach((x,i)=>draw(document.getElementById('c'+i),x))}async function load(){try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('data.json henüz oluşmadı');const d=await r.json();updated.textContent='Son tarama: '+new Date(d.generatedAt).toLocaleString('tr-TR')+' · '+d.source;data=d.results||[];grid.innerHTML=data.length?data.map(card).join(''):'<div class="empty">Henüz tarama sonucu yok.</div>';requestAnimationFrame(paint)}catch(e){grid.innerHTML=`<div class="empty">İlk tarama bekleniyor: ${esc(e.message)}</div>`}}let timer;addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(paint,120)});load();setInterval(load,60000);
</script></body></html>
