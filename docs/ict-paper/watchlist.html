<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İzlenen ICT Setupları</title><style>body{font-family:system-ui;background:#0b1020;color:#e8ecf3;margin:0;padding:24px}.muted{color:#9aa6b2}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}a{color:#93c5fd}table{width:100%;border-collapse:collapse;background:#151c2f;border-radius:14px;overflow:hidden;margin-top:18px}th,td{padding:11px;border-bottom:1px solid #26314f;text-align:left;font-size:13px}th{color:#9aa6b2}.long{color:#6ee7b7}.short{color:#fca5a5}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#25304a}.raid{background:#78350f}.mss{background:#1e3a8a}.wait{background:#374151}.card{margin-top:18px;background:#151c2f;border:1px solid #26314f;border-radius:14px;padding:14px}.refresh{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:9px 12px;cursor:pointer}.click{cursor:pointer;text-decoration:underline;text-underline-offset:3px}</style></head><body><div class="top"><div><h1>İzlenen Setuplar</h1><div class="muted">ICT / MMXM / Turtle Soup • Entry oluşmadan önce takip edilen adaylar</div></div><div><a href="./">Ana Dashboard</a> &nbsp; <button class="refresh" onclick="load()">Yenile</button></div></div><div class="card" id="summary">Yükleniyor…</div><table><thead><tr><th>Parite</th><th>Yön</th><th>Score</th><th>Aşama</th><th>4H</th><th>MMXM</th><th>Raid</th><th>Beklenen Sonraki Adım</th><th>Olası Entry</th><th>SL</th><th>TP3</th></tr></thead><tbody id="rows"></tbody></table><script>const f=n=>n==null?'-':Number(n).toLocaleString('tr-TR',{maximumFractionDigits:6});function next(s){if(s.state==='WAITING_FOR_RAID')return s.direction==='LONG'?'SSL sweep + reclaim bekleniyor':'BSL sweep + reclaim bekleniyor';if(s.state==='LIQUIDITY_SWEPT')return '5M MSS/CISD + displacement bekleniyor';if(s.state==='MSS_CONFIRMED')return 'FVG/OTE retest ile entry bekleniyor';return 'İzleniyor'}function cls(s){if(s==='LIQUIDITY_SWEPT')return'raid';if(s==='MSS_CONFIRMED')return'mss';return'wait'}async function load(){try{const r=await fetch('data.json?'+Date.now());const d=await r.json();const watch=(d.setups||[]).filter(s=>['WAITING_FOR_RAID','LIQUIDITY_SWEPT','MSS_CONFIRMED'].includes(s.state)&&s.direction!=='NONE').sort((a,b)=>(b.score||0)-(a.score||0));const counts={WAITING_FOR_RAID:0,LIQUIDITY_SWEPT:0,MSS_CONFIRMED:0};watch.forEach(s=>counts[s.state]=(counts[s.state]||0)+1);document.getElementById('summary').innerHTML=`<b>${watch.length} setup izleniyor</b> &nbsp; • &nbsp; Raid bekleyen: ${counts.WAITING_FOR_RAID} &nbsp; • &nbsp; Sweep olmuş: ${counts.LIQUIDITY_SWEPT} &nbsp; • &nbsp; MSS onaylı: ${counts.MSS_CONFIRMED}<br><span class=muted>Son güncelleme: ${new Date(d.updated_at).toLocaleString('tr-TR')}</span>`;document.getElementById('rows').innerHTML=watch.map(s=>`<tr><td><a class=click href="./">${s.symbol}</a></td><td class=${s.direction==='LONG'?'long':'short'}>${s.direction}</td><td>${s.score??'-'}</td><td><span class="badge ${cls(s.state)}">${s.state}</span></td><td>${s.htf_bias||'-'}</td><td>${s.mmxm||'-'}</td><td>${s.raid_name||'-'} ${s.raid_level!=null?'@ '+f(s.raid_level):''}</td><td>${next(s)}</td><td>${f(s.entry_low)} - ${f(s.entry_high)}</td><td>${f(s.stop)}</td><td>${f(s.tp3)}</td></tr>`).join('')||'<tr><td colspan=11>Şu an izlenen setup yok.</td></tr>'}catch(e){document.getElementById('summary').textContent='Veri henüz hazırlanıyor.'}}load();setInterval(load,60000)</script></body></html>
