<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICT MMXM Paper Dashboard</title><style>body{font-family:system-ui;background:#0b1020;color:#e8ecf3;margin:0;padding:24px}h1{margin:0 0 8px}.muted{color:#9aa6b2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:20px 0}.card{background:#151c2f;border:1px solid #26314f;border-radius:14px;padding:16px}.big{font-size:28px;font-weight:700}table{width:100%;border-collapse:collapse;background:#151c2f;border-radius:14px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid #26314f;text-align:left;font-size:13px}th{color:#9aa6b2}.long{color:#6ee7b7}.short{color:#fca5a5}.pos{color:#6ee7b7}.neg{color:#fca5a5}.section{margin-top:26px;overflow:auto}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#25304a}.refresh{float:right;background:#2563eb;color:white;border:0;border-radius:9px;padding:9px 12px;cursor:pointer}svg{width:100%;height:220px;background:#151c2f;border-radius:14px;border:1px solid #26314f}.status{margin-top:6px}</style></head><body><button class="refresh" onclick="load()">Yenile</button><h1>ICT / MMXM / Turtle Soup</h1><div class="muted">Bybit Top 50 • Paper Trading • Başlangıç 1.000 USDT • İşlem başı %1 risk</div><div class="status muted" id="updated">Yükleniyor…</div><div class="grid" id="cards"></div><div class="section"><h2>Equity Curve</h2><svg id="curve" viewBox="0 0 1000 220" preserveAspectRatio="none"></svg></div><div class="section"><h2>Açık / Son İşlemler</h2><table><thead><tr><th>Parite</th><th>Yön</th><th>Durum</th><th>Entry</th><th>SL</th><th>TP3</th><th>Risk</th><th>PnL</th><th>R</th></tr></thead><tbody id="trades"></tbody></table></div><div class="section"><h2>Top Setup'lar</h2><table><thead><tr><th>Parite</th><th>Yön</th><th>Grade</th><th>Score</th><th>State</th><th>HTF</th><th>MMXM</th><th>Raid</th><th>Entry</th><th>SL</th><th>TP3</th></tr></thead><tbody id="setups"></tbody></table></div><script>const f=n=>n==null?'-':Number(n).toLocaleString('tr-TR',{maximumFractionDigits:6});async function load(){try{const r=await fetch('data.json?'+Date.now());const d=await r.json();document.getElementById('updated').textContent='Son güncelleme: '+new Date(d.updated_at).toLocaleString('tr-TR');const p=d.portfolio;const items=[['Equity',f(p.equity)+' USDT'],['Toplam PnL',f(p.pnl_usdt)+' USDT'],['Getiri',f(p.return_pct)+'%'],['Sonraki Risk',f(p.next_risk_usdt)+' USDT'],['Açık İşlem',p.open_trades],['Kapalı İşlem',p.closed_trades],['Win Rate',p.win_rate==null?'-':f(p.win_rate)+'%']];document.getElementById('cards').innerHTML=items.map(x=>`<div class=card><div class=muted>${x[0]}</div><div class=big>${x[1]}</div></div>`).join('');document.getElementById('trades').innerHTML=d.trades.map(t=>`<tr><td>${t.symbol}</td><td class=${t.direction==='LONG'?'long':'short'}>${t.direction}</td><td><span class=badge>${t.status}${t.close_reason?' / '+t.close_reason:''}</span></td><td>${f(t.entry)}</td><td>${f(t.stop)}</td><td>${f(t.tp3)}</td><td>${f(t.risk_usdt)}</td><td class=${t.pnl_usdt>=0?'pos':'neg'}>${f(t.pnl_usdt)}</td><td>${f(t.r_multiple)}</td></tr>`).join('');document.getElementById('setups').innerHTML=d.setups.map(s=>`<tr><td>${s.symbol}</td><td class=${s.direction==='LONG'?'long':'short'}>${s.direction}</td><td>${s.grade||'-'}</td><td>${s.score}</td><td>${s.state}</td><td>${s.htf_bias||'-'}</td><td>${s.mmxm||'-'}</td><td>${s.raid_name||'-'}</td><td>${f(s.entry_low)} - ${f(s.entry_high)}</td><td>${f(s.stop)}</td><td>${f(s.tp3)}</td></tr>`).join('');draw(d.curve)}catch(e){document.getElementById('updated').textContent='Veri henüz hazırlanıyor.'}}function draw(c){const svg=document.getElementById('curve');if(!c||!c.length){svg.innerHTML='';return}const v=c.map(x=>x.equity),mn=Math.min(...v),mx=Math.max(...v),span=Math.max(mx-mn,1);const pts=v.map((y,i)=>`${i/(v.length-1||1)*1000},${200-(y-mn)/span*170}`).join(' ');svg.innerHTML=`<polyline fill="none" stroke="currentColor" stroke-width="3" points="${pts}"/><text x="10" y="20" fill="currentColor">${f(mx)} USDT</text><text x="10" y="210" fill="currentColor">${f(mn)} USDT</text>`}load();setInterval(load,60000)</script></body></html>
