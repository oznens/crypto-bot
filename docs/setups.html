<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V34 Setup Journal</title>
<style>:root{--bg:#0b0e13;--p:#121722;--l:#2b3442;--t:#e6edf3;--d:#8b949e;--g:#5fd99a;--r:#f08a8a;--y:#e8c34a;--b:#79c0ff}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--t);font:14px Arial}a{color:var(--b);text-decoration:none}.hero{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:21px;margin:0}.sub{color:var(--d);margin:6px 0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}.card,.filters{background:var(--p);border:1px solid var(--l);border-radius:9px;padding:12px}.k{font-size:10px;color:var(--d)}.v{font-size:19px;font-weight:bold;margin-top:4px}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.b{color:var(--b)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}select,input{background:#0d121b;color:var(--t);border:1px solid var(--l);border-radius:7px;padding:8px}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;background:var(--p);border:1px solid var(--l)}th,td{padding:8px;border-bottom:1px solid var(--l);text-align:right;white-space:nowrap}th{font-size:10px;color:var(--d)}th:first-child,td:first-child{text-align:left}.tag{padding:3px 7px;border-radius:5px;font-size:10px;font-weight:bold}.OPENED,.CLOSED{color:var(--g);background:#16372a}.WATCHING{color:var(--y);background:#3b3215}.REJECTED{color:var(--r);background:#3a1c20}.OBSERVED{color:var(--b);background:#172f42}.reason{max-width:310px;overflow:hidden;text-overflow:ellipsis}</style></head>
<body><div class="hero"><div><h1>🔎 V34 Setup Journal</h1><div class="sub" id="sub">yükleniyor…</div></div><a href="./">← Ana sayfa</a></div><div class="cards" id="cards"></div>
<div class="filters"><select id="status"><option value="">Tüm durumlar</option><option>WATCHING</option><option>REJECTED</option><option>OPENED</option><option>CLOSED</option></select><select id="tf"><option value="">Tüm zaman dilimleri</option></select><input id="q" placeholder="Sembol veya model ara"><select id="limit"><option>100</option><option>250</option><option>500</option></select></div>
<div class="wrap"><table><thead><tr><th>Setup</th><th>Durum</th><th>TF</th><th>Yön</th><th>Model</th><th>Güven</th><th>Not</th><th>Giriş</th><th>SL</th><th>TP-F</th><th>Confluence</th><th>Karar/Neden</th><th>Son Görülme</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>let DATA=[];const f=(v,d=4)=>v==null?'—':Number(v).toFixed(d),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const card=(k,v,c='')=>`<div class="card"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;
function render(){const st=status.value,qv=q.value.toLowerCase(),tv=tf.value,n=+limit.value;const rows=DATA.filter(x=>(!st||x.status===st)&&(!tv||x.tf===tv)&&(!qv||(x.symbol+' '+(x.setup?.model||'')).toLowerCase().includes(qv))).slice(0,n);document.getElementById('rows').innerHTML=rows.map(x=>{const s=x.setup||{},tp=s.targets?.at(-1),c=x.context?.confluence;return `<tr><td><a href="setup.html?id=${encodeURIComponent(x.id)}"><b>${esc(x.symbol)}</b></a></td><td><span class="tag ${x.status}">${x.status}</span></td><td>${esc(x.tf||'—')}</td><td>${esc(s.side||'—')}</td><td>${esc(s.model||'—')}</td><td>${s.confidence==null?'—':'%'+s.confidence}</td><td>${esc(s.grade||'—')}</td><td>${f(s.entry)}</td><td>${f(s.stop)}</td><td>${f(tp)}</td><td>${c?c.score+'/100 · '+c.grade:'—'}</td><td class="reason" title="${esc(x.reason)}">${esc(x.decision||'')} · ${esc(x.reason||'—')}</td><td>${new Date(x.lastSeenAt).toLocaleString('tr-TR')}</td></tr>`}).join('')||'<tr><td colspan="13">Kayıt bulunamadı.</td></tr>'}
async function load(){try{const r=await fetch('setup_journal.json?t='+Date.now());if(!r.ok)throw Error('setup_journal.json yok');const j=await r.json();DATA=j.setups||[];const s=j.summary||{};sub.textContent='Sürüm '+j.version+' · '+new Date(j.generatedAt).toLocaleString('tr-TR')+' · kayıt '+DATA.length;cards.innerHTML=[card('İzleniyor',s.watching||0,'y'),card('Reddedildi',s.rejected||0,'r'),card('İşleme Döndü',s.opened||0,'g'),card('Kapandı',s.closed||0,'g'),card('Toplam',s.total||0,'b')].join('');[...new Set(DATA.map(x=>x.tf).filter(Boolean))].sort().forEach(v=>tf.insertAdjacentHTML('beforeend',`<option>${v}</option>`));render()}catch(e){sub.textContent='İlk V34 paper koşumu bekleniyor: '+e.message}}['status','tf','q','limit'].forEach(id=>document.getElementById(id).addEventListener('input',render));load();setInterval(load,60000);</script></body></html>
