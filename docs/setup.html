<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V34 Setup Detayı</title>
<style>:root{--bg:#0b0e13;--p:#121722;--l:#2b3442;--t:#e6edf3;--d:#8b949e;--g:#5fd99a;--r:#f08a8a;--y:#e8c34a;--b:#79c0ff}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--t);font:14px Arial}a{color:var(--b);text-decoration:none}.hero{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:21px;margin:0}.sub{color:var(--d);margin:6px 0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:14px}.card,.panel{background:var(--p);border:1px solid var(--l);border-radius:9px;padding:12px}.k{font-size:10px;color:var(--d)}.v{font-size:18px;font-weight:bold;margin-top:4px}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.b{color:var(--b)}canvas{width:100%;height:440px;background:#0d121b;border:1px solid var(--l);border-radius:9px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-top:12px}.panel h2{font-size:14px;margin:0 0 10px}.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--l)}.row:last-child{border:0}.row span:first-child{color:var(--d)}pre{white-space:pre-wrap;word-break:break-word;color:#cbd5e1;margin:0}.tag{padding:3px 7px;border-radius:5px;font-size:10px;font-weight:bold}.OPENED,.CLOSED{color:var(--g);background:#16372a}.WATCHING{color:var(--y);background:#3b3215}.REJECTED{color:var(--r);background:#3a1c20}</style></head>
<body><div class="hero"><div><h1 id="title">📌 Setup Detayı</h1><div class="sub" id="sub">yükleniyor…</div></div><a href="setups.html">← Setup Journal</a></div><div class="cards" id="cards"></div><canvas id="chart"></canvas><div class="grid"><section class="panel"><h2>Karar ve Context</h2><div id="decision"></div></section><section class="panel"><h2>Confluence Kırılımı</h2><div id="breakdown"></div></section><section class="panel"><h2>Model Detayları</h2><pre id="context"></pre></section><section class="panel"><h2>İşlem Bağlantısı</h2><div id="trade"></div></section></div>
<script>
const num=v=>v===null||v===undefined||v===''?null:(Number.isFinite(Number(v))?Number(v):null);
const f=(v,d=4)=>num(v)===null?'—':num(v).toFixed(d),row=(k,v)=>`<div class="row"><span>${k}</span><b>${v??'—'}</b></div>`,card=(k,v,c='')=>`<div class="card"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;let ITEM=null;
function entryOf(item){const s=item.setup||{},e=num(s.entry),sl=num(s.stop),m=num(item.marketPrice);const same=e!==null&&sl!==null&&Math.abs(e-sl)<=Math.max(1e-12,Math.abs(sl)*1e-10);if(m!==null&&(e===null||same||e<=0))return m;return e!==null&&e>0?e:null}
function draw(item){const cv=chart,ctx=cv.getContext('2d'),D=devicePixelRatio||1,W=cv.clientWidth,H=440;cv.width=W*D;cv.height=H*D;ctx.scale(D,D);ctx.clearRect(0,0,W,H);const a=item.snapshot?.candles||[];if(a.length<2){ctx.fillStyle='#8b949e';ctx.fillText('Mum snapshot bulunamadı.',20,40);return}const prices=a.flatMap(x=>[x[2],x[3]]),s=item.setup||{},entry=entryOf(item),levels=[entry,num(s.stop),...(s.targets||[]).map(num)].filter(v=>v!==null);prices.push(...levels);const lo=Math.min(...prices),hi=Math.max(...prices),pad=(hi-lo)*.08||1,min=lo-pad,max=hi+pad,X=i=>42+(W-62)*i/(a.length-1),Y=p=>20+(H-52)*(max-p)/(max-min),bw=Math.max(2,(W-62)/a.length*.62);ctx.strokeStyle='#273244';ctx.fillStyle='#8b949e';ctx.font='10px Arial';for(let i=0;i<5;i++){const p=max-(max-min)*i/4,y=Y(p);ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(W-12,y);ctx.stroke();ctx.fillText(p.toFixed(4),2,y+3)}a.forEach((c,i)=>{const o=c[1],h=c[2],l=c[3],cl=c[4],x=X(i),up=cl>=o;ctx.strokeStyle=up?'#5fd99a':'#f08a8a';ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(x,Y(h));ctx.lineTo(x,Y(l));ctx.stroke();ctx.fillRect(x-bw/2,Math.min(Y(o),Y(cl)),bw,Math.max(1,Math.abs(Y(o)-Y(cl))))});function line(p,label,color){const value=num(p);if(value===null)return;const y=Y(value);ctx.strokeStyle=color;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(W-12,y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=color;ctx.fillText(label+' '+value.toFixed(4),W-155,y-4)}line(entry,'ENTRY','#79c0ff');line(s.stop,'SL','#f08a8a');(s.targets||[]).forEach((p,i)=>line(p,'TP'+(i+1),'#5fd99a'))}
async function load(){const id=new URLSearchParams(location.search).get('id');try{const r=await fetch('setup_journal.json?t='+Date.now());if(!r.ok)throw Error('journal yok');const j=await r.json(),x=(j.setups||[]).find(v=>v.id===id);if(!x)throw Error('setup bulunamadı');ITEM=x;const s=x.setup||{},c=x.context||{},entry=entryOf(x);title.textContent=`${x.symbol} · ${x.tf} · ${s.model||'Setup'}`;sub.innerHTML=`<span class="tag ${x.status}">${x.status}</span> · ${new Date(x.lastSeenAt).toLocaleString('tr-TR')}`;cards.innerHTML=[card('Yön',s.side||'—',s.side==='LONG'?'g':'r'),card('Güven',s.confidence==null?'—':'%'+s.confidence,'b'),card('Not',s.grade||'—','y'),card('Giriş',f(entry),'b'),card('Stop',f(s.stop),'r'),card('Final TP',f(s.targets?.at(-1)),'g'),card('Plan RR',num(s.rr)===null?'—':f(s.rr,2)+'R','b'),card('Confluence',c.confluence?c.confluence.score+'/100 · '+c.confluence.grade:'—','y')].join('');decision.innerHTML=row('Karar',x.decision)+row('Neden',x.reason)+row('İlk görülme',new Date(x.firstSeenAt).toLocaleString('tr-TR'))+row('Son görülme',new Date(x.lastSeenAt).toLocaleString('tr-TR'))+row('Alt TF',x.lowerTf||'—')+row('Piyasa fiyatı',f(x.marketPrice))+row('Risk çarpanı',s.portfolioRiskMultiplier==null?'—':s.portfolioRiskMultiplier+'×');breakdown.innerHTML=(c.confluence?.breakdown||[]).map(b=>row(b.key,`${b.points}/${b.weight}`)).join('')||row('Durum','Kırılım yok');context.textContent=JSON.stringify({reasons:s.reasons,mtf:c.mtf,killzone:c.killzone,smt:c.smt,liquidity:c.liquidity,mmxm:c.mmxm,wyckoff:c.wyckoff,quarterly:c.quarterly,ict:c.ict,sbs:c.sbs,sessionLiquidity:c.sessionLiquidity,executionCost:c.executionCost,bigE:c.bigE,unicorn:c.unicorn,nineStars:c.nineStars,hps:c.hps},null,2);trade.innerHTML=row('Trade ID',x.tradeId||'—')+row('Durum',x.status)+row('Kapanış',x.closedAt?new Date(x.closedAt).toLocaleString('tr-TR'):'—')+row('Sonuç R',x.resultR==null?'—':x.resultR+'R')+row('Kapanış nedeni',x.closeReason||'—');draw(x)}catch(e){sub.textContent=e.message}}load();addEventListener('resize',()=>ITEM&&draw(ITEM));
</script></body></html>
