<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galatalı BIST</title><script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:8px 10px 35px}.top{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;border-bottom:1px solid #eee;padding:5px 0 8px}.top h1{font-size:20px;margin:0}.muted{font-size:11px;color:#777}.top a{color:#333}.filters{display:flex;gap:5px;flex-wrap:wrap;padding:8px 0}.filters button{background:#fff;border:1px solid #bbb;border-radius:3px;padding:6px 9px;font-weight:650}.filters .active{background:#222;color:#fff}.grid{display:grid;grid-template-columns:1fr;gap:18px}.card{border:1px solid #ddd;background:#fff}.head{padding:6px 10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.sym{font-weight:750}.tags{font-size:11px;color:#666}.stage{position:relative;height:clamp(410px,53vw,690px);background:#fff}.chart{position:absolute;inset:0}.overlay{position:absolute;inset:0;z-index:5;pointer-events:none}.label{position:absolute;background:#111;color:#fff;border-radius:3px;padding:3px 5px;font-size:10px;font-weight:750}.desc{padding:8px 10px 10px;font-size:13px;line-height:1.5}.desc b{font-weight:750}.pos{color:#089981}.neg{color:#f23645}@media(max-width:650px){.wrap{padding:4px}.stage{height:390px}.label{font-size:8px}.desc{font-size:11px}.top h1{font-size:17px}}</style></head><body><main class="wrap"><header class="top"><div><h1>Galatalı Metodu — BIST</h1><div id="meta" class="muted">yükleniyor…</div></div><a href="../">Ana sayfa</a></header><nav class="filters"><button data-f="AA" class="active">A+/A</button><button data-f="inside">PRZ içinde</button><button data-f="near">PRZ yakın</button><button data-f="pos">Pozitif</button><button data-f="neg">Negatif</button><button data-f="all">Tümü</button></nav><section id="grid" class="grid"></section></main><script>let DATA=[],CHARTS={};const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function pick(f){if(f==='AA')return DATA.filter(x=>['A+','A'].includes(x.grade));if(f==='inside')return DATA.filter(x=>x.status==='PRZ içinde');if(f==='near')return DATA.filter(x=>x.status==='PRZ yaklaşıyor');if(f==='pos')return DATA.filter(x=>x.direction==='pozitif');if(f==='neg')return DATA.filter(x=>x.direction==='negatif');return DATA}function ni(b,p,s=0){let z=s,d=Infinity;for(let i=s;i<b.length;i++){let q=Math.min(Math.abs(+b[i].high-p),Math.abs(+b[i].low-p));if(q<d){d=q;z=i}}return z}function line(chart,data,color='#222',width=2,style=0){const s=chart.addSeries(LightweightCharts.LineSeries,{color,lineWidth:width,lineStyle:style,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});s.setData(data);return s}function draw(el,ov,f,b){const chart=LightweightCharts.createChart(el,{layout:{background:{type:'solid',color:'#ffffff'},textColor:'#4b4b4b',fontSize:10,attributionLogo:false},grid:{vertLines:{color:'#f0f1f2'},horzLines:{color:'#eceeef'}},rightPriceScale:{borderVisible:false,scaleMargins:{top:.08,bottom:.09}},timeScale:{borderColor:'#ddd',rightOffset:22,barSpacing:7,minBarSpacing:2,timeVisible:false},crosshair:{mode:0,vertLine:{color:'#bbb',style:3,labelVisible:false},horzLine:{color:'#bbb',style:3}}});const cs=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350',priceLineVisible:true,priceLineColor:'#ef5350',priceLineStyle:2,lastValueVisible:true});cs.setData(b);let k=0,P=[];for(const [n,p] of [['X',+f.x],['A',+f.a],['B',+f.b],['C',+f.c]]){k=ni(b,p,k);P.push({n,p,t:b[k].time,i:k})}const di=Math.min(b.length-1,Math.max(k+1,b.length-12));P.push({n:'D',p:+f.prz_mid,t:b[di].time,i:di});line(chart,P.map(x=>({time:x.t,value:x.p})),'#171717',2);if(LightweightCharts.createSeriesMarkers)LightweightCharts.createSeriesMarkers(cs,P.map((x,i)=>({time:x.t,position:i%2?'belowBar':'aboveBar',color:'#111',shape:'square',text:x.n})));const xa=Math.abs(+f.a-(+f.x)),lo=+f.prz_low,hi=+f.prz_high,mid=+f.prz_mid,last=b[b.length-1].time,first=b[Math.max(0,P[0].i-5)].time;const support1=lo,support2=Math.max(0,lo-xa*.18),res1=f.direction==='pozitif'?mid+xa*.12:mid-xa*.12,target=f.direction==='pozitif'?mid+xa*1.15:mid-xa*1.15;[[+f.a,'#222',2],[res1,'#333',2],[hi,'#333',2],[support1,'#2962ff',3],[support2,'#333',2],[target,'#222',2]].forEach(([p,c,w])=>line(chart,[{time:first,value:p},{time:last,value:p}],c,w));const fibs=[['0.538',.538],['0.641',.641],['1.85',1.85],['0.944',.944]];fibs.forEach(([n,r],j)=>{let p=f.direction==='pozitif'?Math.min(+f.x,+f.a)+xa*(j<2?r*.45:r*.15):Math.max(+f.x,+f.a)-xa*(j<2?r*.45:r*.15);line(chart,[{time:P[Math.min(j,3)].t,value:p},{time:P[4].t,value:mid}],'#c7b86c',1,2)});line(chart,[{time:P[4].t,value:mid},{time:last,value:target}],'#222',2);ov.innerHTML=`<div class="label" style="left:20%;top:28%">${E(f.pattern)}</div><div class="label" style="left:34%;top:39%">${E(f.b_xa||'0.618')}</div><div class="label" style="left:48%;top:57%">${E(f.bc_ab||'1.618')}</div>`;chart.timeScale().fitContent();new ResizeObserver(x=>chart.applyOptions({width:x[0].contentRect.width,height:x[0].contentRect.height})).observe(el)}function render(filter='AA'){const a=pick(filter).slice(0,60),g=document.getElementById('grid');g.innerHTML=a.map((x,i)=>`<article class="card"><div class="head"><span class="sym">${E(x.symbol)} · ${E(x.timeframe)}</span><span class="tags">${E(x.pattern)} · ${E(x.grade)} · ${E(x.confidence)}/100 · <b class="${x.direction==='pozitif'?'pos':'neg'}">${E(x.status)}</b></span></div><div class="stage"><div id="c${i}" class="chart"></div><div id="o${i}" class="overlay"></div></div><div class="desc"><b>#${E(x.symbol)}</b> ${x.direction==='pozitif'?'🍀 Pozitif':'Negatif'} ${E(x.pattern)} formasyonu takip ediliyor.<br><b>Destek / toplama bandı:</b> ${E(x.prz_low)}–${E(x.prz_high)}<br><b>Direnç:</b> ${E(x.prz_mid)} &nbsp; <b>Son:</b> ${E(x.last)}<br><b>Durum:</b> ${E(x.status)}</div></article>`).join('');requestAnimationFrame(()=>a.forEach((x,i)=>{const b=CHARTS[`${x.symbol}|${x.timeframe}`];if(b?.length)draw(document.getElementById('c'+i),document.getElementById('o'+i),x,b)}))}const BASE='https://raw.githubusercontent.com/oznens/crypto-bot/main/data/galatali_bist/';Promise.all([fetch(BASE+'prz_scan.json?x='+Date.now()).then(r=>r.json()),fetch(BASE+'charts.json?x='+Date.now()).then(r=>r.json())]).then(([j,c])=>{DATA=j.findings||[];CHARTS=c.charts||{};document.getElementById('meta').textContent=`${new Date(j.generated_at).toLocaleString('tr-TR')} · ${j.universe} hisse · ${DATA.length} yapı`;render()});document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(z=>z.classList.remove('active'));b.classList.add('active');render(b.dataset.f)});</script></body></html>
