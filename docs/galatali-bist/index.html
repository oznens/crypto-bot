<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galatalı BIST</title><script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#ddd;font-family:Arial,sans-serif}.wrap{max-width:1600px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:end;gap:10px}.top h1{margin:0;color:#fff;font-size:22px}.muted{font-size:12px;color:#999}.top a{color:#ddd}.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.filters button{background:#222;color:#ddd;border:1px solid #555;padding:7px 10px}.filters .active{background:#eee;color:#111}.grid{display:grid;grid-template-columns:1fr;gap:22px}.card{background:#0c0c0c;border:1px solid #333}.head{padding:7px 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.sym{font-size:18px;font-weight:800;color:#fff}.tags{font-size:11px;color:#aaa}.stage{height:clamp(430px,55vw,760px);position:relative}.chart{position:absolute;inset:0}.overlay{position:absolute;inset:0;pointer-events:none;z-index:5}.note{position:absolute;padding:3px 5px;background:#111d;color:#eee;border:1px solid #777;font-size:10px;font-weight:700;white-space:nowrap}.brand{position:absolute;left:12px;top:10px;color:#ddd;font-size:12px;font-weight:700}.foot{padding:7px 10px;font-size:11px;color:#aaa;border-top:1px solid #333}.pos{color:#33d17a}.neg{color:#ff5c69}@media(max-width:650px){.wrap{padding:5px}.stage{height:430px}.note{font-size:8px}.top h1{font-size:18px}}</style></head><body><main class="wrap"><header class="top"><div><h1>Galatalı Metodu — BIST</h1><div id="meta" class="muted">yükleniyor…</div></div><a href="../">Ana sayfa</a></header><nav class="filters"><button data-f="AA" class="active">A+/A</button><button data-f="inside">PRZ içinde</button><button data-f="near">PRZ yakın</button><button data-f="pos">Pozitif</button><button data-f="neg">Negatif</button><button data-f="all">Tümü</button></nav><section id="grid" class="grid"></section></main><script>let DATA=[],CHARTS={};const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function pick(f){if(f==='AA')return DATA.filter(x=>['A+','A'].includes(x.grade));if(f==='inside')return DATA.filter(x=>x.status==='PRZ içinde');if(f==='near')return DATA.filter(x=>x.status==='PRZ yaklaşıyor');if(f==='pos')return DATA.filter(x=>x.direction==='pozitif');if(f==='neg')return DATA.filter(x=>x.direction==='negatif');return DATA}function idxNear(b,p,start=0){let z=start,d=1e99;for(let i=start;i<b.length;i++){let q=Math.min(Math.abs(+b[i].high-p),Math.abs(+b[i].low-p));if(q<d){d=q;z=i}}return z}function addLine(chart,data,color,width=2,style=0){let s=chart.addSeries(LightweightCharts.LineSeries,{color,lineWidth:width,lineStyle:style,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});s.setData(data);return s}function draw(el,ov,f,b){const chart=LightweightCharts.createChart(el,{layout:{background:{type:'solid',color:'#0b0b0b'},textColor:'#aaa',fontSize:10,attributionLogo:false},grid:{vertLines:{color:'#242424'},horzLines:{color:'#242424'}},rightPriceScale:{borderColor:'#555',scaleMargins:{top:.09,bottom:.09}},timeScale:{borderColor:'#555',rightOffset:12,barSpacing:7,minBarSpacing:2},crosshair:{mode:0,vertLine:{color:'#777',style:3},horzLine:{color:'#777',style:3}}});const cs=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#e6e6e6',downColor:'#111',borderUpColor:'#eee',borderDownColor:'#aaa',wickUpColor:'#ddd',wickDownColor:'#aaa',priceLineVisible:false});cs.setData(b);let k=0,P=[];for(const [n,p] of [['X',+f.x],['A',+f.a],['B',+f.b],['C',+f.c]]){k=idxNear(b,p,k);P.push({n,p,t:b[k].time,i:k})}let di=Math.min(b.length-1,Math.max(k+2,b.length-5));P.push({n:'D',p:+f.prz_mid,t:b[di].time,i:di});addLine(chart,P.map(x=>({time:x.t,value:x.p})),'#f2d14b',3);if(LightweightCharts.createSeriesMarkers){LightweightCharts.createSeriesMarkers(cs,P.map((x,i)=>({time:x.t,position:i%2?'belowBar':'aboveBar',color:'#f2d14b',shape:'circle',text:x.n})))}const lo=+f.prz_low,hi=+f.prz_high,mid=+f.prz_mid,xa=Math.abs(+f.a-(+f.x)),lastT=b[b.length-1].time,startT=b[Math.max(0,P[3].i-3)].time;[lo,hi].forEach((p,i)=>addLine(chart,[{time:startT,value:p},{time:lastT,value:p}],'#ff3b30',2,2));const fib=[.382,.5,.618,.786,.886,1,1.272,1.618],base=Math.min(+f.x,+f.a);fib.forEach(r=>{let p=base+xa*r;addLine(chart,[{time:P[0].t,value:p},{time:lastT,value:p}],'#555',1,3)});const target=f.direction==='pozitif'?mid+xa*.618:mid-xa*.618;addLine(chart,[{time:P[3].t,value:target},{time:lastT,value:target}],'#2ecc71',2,2);const invalid=f.direction==='pozitif'?lo-xa*.12:hi+xa*.12;addLine(chart,[{time:P[3].t,value:invalid},{time:lastT,value:invalid}],'#e74c3c',1,2);let trend1=P[0],trend2=P[2];addLine(chart,[{time:trend1.t,value:trend1.p},{time:lastT,value:trend2.p+(trend2.p-trend1.p)*1.1}],'#36a2ff',1,0);ov.innerHTML=`<div class="brand">${E(f.symbol)} · ${E(f.timeframe)}<br>${E(f.pattern)} ${f.direction==='pozitif'?'POZİTİF':'NEGATİF'} FORMASYON</div><div class="note" style="right:72px;top:16%">TEKNİK HEDEF ≈ ${target.toFixed(2)}</div><div class="note" style="right:72px;top:47%;border-color:#ff3b30">PRZ / DOĞRU MALİYET<br>${E(f.prz_low)} — ${E(f.prz_high)}</div><div class="note" style="left:12px;bottom:10%">Geçersizlik ≈ ${invalid.toFixed(2)}</div>`;chart.timeScale().fitContent();new ResizeObserver(x=>chart.applyOptions({width:x[0].contentRect.width,height:x[0].contentRect.height})).observe(el)}function render(f='AA'){let a=pick(f).slice(0,60),g=document.getElementById('grid');g.innerHTML=a.map((x,i)=>`<article class="card"><div class="head"><span class="sym">${E(x.symbol)}</span><span class="tags">${E(x.pattern)} · ${E(x.timeframe)} · ${E(x.grade)} · ${E(x.confidence)}/100 · <b class="${x.direction==='pozitif'?'pos':'neg'}">${E(x.status)}</b></span></div><div class="stage"><div id="c${i}" class="chart"></div><div id="o${i}" class="overlay"></div></div><div class="foot">X ${E(x.x)} · A ${E(x.a)} · B ${E(x.b)} · C ${E(x.c)} · D/PRZ ${E(x.prz_mid)} · Son ${E(x.last)} · B/XA ${E(x.b_xa)} · BC/AB ${E(x.bc_ab)}</div></article>`).join('');requestAnimationFrame(()=>a.forEach((x,i)=>{let b=CHARTS[`${x.symbol}|${x.timeframe}`];if(b?.length)draw(document.getElementById('c'+i),document.getElementById('o'+i),x,b)}))}const BASE='https://raw.githubusercontent.com/oznens/crypto-bot/main/data/galatali_bist/';Promise.all([fetch(BASE+'prz_scan.json?x='+Date.now()).then(r=>r.json()),fetch(BASE+'charts.json?x='+Date.now()).then(r=>r.json())]).then(([j,c])=>{DATA=j.findings||[];CHARTS=c.charts||{};document.getElementById('meta').textContent=`${new Date(j.generated_at).toLocaleString('tr-TR')} · ${j.universe} hisse · ${DATA.length} yapı`;render()});document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(z=>z.classList.remove('active'));b.classList.add('active');render(b.dataset.f)});</script></body></html>
