<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galatalı BIST</title><script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:8px 10px 35px}.top{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;border-bottom:1px solid #eee;padding:5px 0 8px}.top h1{font-size:20px;margin:0}.muted{font-size:11px;color:#777}.filters{display:flex;gap:5px;flex-wrap:wrap;padding:8px 0}.filters button{background:#fff;border:1px solid #bbb;border-radius:3px;padding:6px 9px;font-weight:650}.filters .active{background:#222;color:#fff}.grid{display:grid;grid-template-columns:1fr;gap:18px}.card{border:1px solid #ddd;background:#fff}.head{padding:6px 10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.sym{font-weight:750}.tags{font-size:11px;color:#666}.stage{position:relative;height:clamp(410px,53vw,690px);background:#fff}.chart{position:absolute;inset:0}.desc{padding:8px 10px 10px;font-size:13px;line-height:1.5}.pill{display:inline-block;border:1px solid #bbb;border-radius:10px;padding:1px 6px;margin:2px;font-size:11px}.pos{color:#089981}.neg{color:#f23645}.warn{color:#a66b00}@media(max-width:650px){.wrap{padding:4px}.stage{height:390px}.desc{font-size:11px}.top h1{font-size:17px}}</style></head><body><main class="wrap"><header class="top"><div><h1>Galatalı Metodu — Harmonik + Klasik</h1><div id="meta" class="muted">yükleniyor…</div></div><a href="../">Ana sayfa</a></header><nav class="filters"><button data-f="AA" class="active">A+/A</button><button data-f="harm">Harmonik</button><button data-f="classic">Klasik</button><button data-f="pos">Pozitif</button><button data-f="neg">Negatif</button><button data-f="all">Tümü</button></nav><section id="grid" class="grid"></section></main><script>let DATA=[],CHARTS={};const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function pick(f){if(f==='AA')return DATA.filter(x=>['A+','A'].includes(x.grade));if(f==='harm')return DATA.filter(x=>x.family==='harmonic');if(f==='classic')return DATA.filter(x=>x.family==='classic');if(f==='pos')return DATA.filter(x=>x.direction==='pozitif');if(f==='neg')return DATA.filter(x=>x.direction==='negatif');return DATA}function line(chart,data,color='#222',width=2,style=0){const s=chart.addSeries(LightweightCharts.LineSeries,{color,lineWidth:width,lineStyle:style,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});s.setData(data);return s}function idxDate(b,d){if(!d)return-1;let i=b.findIndex(x=>x.time===d);if(i>=0)return i;let w=Date.parse(d),best=-1,dd=Infinity;b.forEach((x,j)=>{let z=Math.abs(Date.parse(x.time)-w);if(z<dd){dd=z;best=j}});return best}function nearest(b,p,s,e){s=Math.max(0,s||0);e=Math.min(b.length-1,e==null?b.length-1:e);let k=-1,d=Infinity;for(let i=s;i<=e;i++){let z=Math.min(Math.abs(+b[i].high-p),Math.abs(+b[i].low-p),Math.abs(+b[i].close-p));if(z<d){d=z;k=i}}return k}function pv(b,n,p,d,s,e){let i=idxDate(b,d);if(i<s||i>(e??b.length-1))i=-1;if(i<0)i=nearest(b,+p,s,e);return i<0?null:{n,p:+p,t:b[i].time,i}}function mkChart(el,b){const c=LightweightCharts.createChart(el,{layout:{background:{type:'solid',color:'#fff'},textColor:'#4b4b4b',fontSize:10,attributionLogo:false},grid:{vertLines:{color:'#f0f1f2'},horzLines:{color:'#eceeef'}},rightPriceScale:{borderVisible:false,scaleMargins:{top:.08,bottom:.09}},timeScale:{borderColor:'#ddd',rightOffset:22,barSpacing:7,minBarSpacing:2},crosshair:{mode:0}});const cs=c.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350',priceLineVisible:true,priceLineStyle:2,lastValueVisible:true});cs.setData(b);new ResizeObserver(x=>c.applyOptions({width:x[0].contentRect.width,height:x[0].contentRect.height})).observe(el);return[c,cs]}function drawH(el,f,b){const[c,cs]=mkChart(el,b),n=b.length;let X=pv(b,'X',f.x,f.x_date,0,n-4),A=X&&pv(b,'A',f.a,f.a_date,X.i+1,n-3),B=A&&pv(b,'B',f.b,f.b_date,A.i+1,n-2),C=B&&pv(b,'C',f.c,f.c_date,B.i+1,n-1);if(!X||!A||!B||!C){c.timeScale().fitContent();return}let D=null;if(f.d_confirmed&&f.d_date){let i=idxDate(b,f.d_date);if(i>=0)D={n:'D',p:+f.d,t:b[i].time,i}}let g=[X,A,B,C].concat(D?[D]:[]);line(c,g.map(z=>({time:z.t,value:z.p})),'#171717',4);if(LightweightCharts.createSeriesMarkers)LightweightCharts.createSeriesMarkers(cs,g.map((z,i)=>({time:z.t,position:i%2?'aboveBar':'belowBar',color:'#111',shape:'square',text:z.n})));let first=b[Math.max(0,X.i-5)].time,last=b[b.length-1].time,lo=+f.prz_low,hi=+f.prz_high,mid=+f.prz_mid;line(c,[{time:first,value:lo},{time:last,value:lo}],'#2962ff',2);line(c,[{time:first,value:hi},{time:last,value:hi}],'#333',2);if(!D)line(c,[{time:C.t,value:C.p},{time:last,value:mid}],'#777',3,2);c.timeScale().fitContent()}function drawC(el,f,b){const[c,cs]=mkChart(el,b),pts=(f.geometry||[]).map(z=>{let i=idxDate(b,z.date);return i>=0?{n:z.label,p:+z.price,t:b[i].time,i}:null}).filter(Boolean);if(pts.length>1)line(c,pts.map(z=>({time:z.t,value:z.p})),'#171717',4);if(LightweightCharts.createSeriesMarkers&&pts.length)LightweightCharts.createSeriesMarkers(cs,pts.map((z,i)=>({time:z.t,position:i%2?'aboveBar':'belowBar',color:'#111',shape:'square',text:z.n})));let first=b[0].time,last=b[b.length-1].time;if(f.support)line(c,[{time:first,value:+f.support},{time:last,value:+f.support}],'#2962ff',2);if(f.resistance)line(c,[{time:first,value:+f.resistance},{time:last,value:+f.resistance}],'#333',2);if(f.target)line(c,[{time:first,value:+f.target},{time:last,value:+f.target}],'#222',2);c.timeScale().fitContent()}function draw(el,f,b){f.family==='classic'?drawC(el,f,b):drawH(el,f,b)}function render(filter='AA'){const a=pick(filter).slice(0,70),g=document.getElementById('grid');g.innerHTML=a.map((x,i)=>`<article class="card"><div class="head"><span class="sym">${E(x.symbol)} · ${E(x.timeframe)}</span><span class="tags">${E(x.family==='classic'?'KLASİK':'HARMONİK')} · ${E(x.pattern)} · ${E(x.grade)} · ${E(x.confidence)}/100 · <b class="${x.direction==='pozitif'?'pos':'neg'}">${E(x.status)}</b></span></div><div class="stage"><div id="c${i}" class="chart"></div></div><div class="desc"><b>#${E(x.symbol)}</b> ${x.direction==='pozitif'?'🍀 Pozitif':'🔻 Negatif'} <b>${E(x.pattern)}</b><br>${x.family==='harmonic'?`<b>PRZ:</b> ${E(x.prz_low)}–${E(x.prz_high)} · <b>B/XA:</b> ${E(x.b_xa)} · <b>BC/AB:</b> ${E(x.bc_ab)}`:`<b>Destek:</b> ${E(x.support??'-')} · <b>Direnç:</b> ${E(x.resistance??'-')} · <b>Hedef:</b> ${E(x.target??'-')}`}<br>${(x.confluences||[]).length?`<b>Konfluans:</b> ${(x.confluences||[]).map(z=>`<span class="pill">${E(z)}</span>`).join('')}`:''}${x.note?`<br><span class="muted">${E(x.note)}</span>`:''}</div></article>`).join('');requestAnimationFrame(()=>a.forEach((x,i)=>{const b=CHARTS[`${x.symbol}|${x.timeframe}`];if(b?.length)draw(document.getElementById('c'+i),x,b)}))}const BASE='https://raw.githubusercontent.com/oznens/crypto-bot/main/data/galatali_bist/';Promise.all([fetch(BASE+'prz_scan.json?x='+Date.now()).then(r=>r.json()),fetch(BASE+'charts.json?x='+Date.now()).then(r=>r.json())]).then(([j,c])=>{DATA=j.findings||[];CHARTS=c.charts||{};document.getElementById('meta').textContent=`${new Date(j.generated_at).toLocaleString('tr-TR')} · ${j.universe} hisse · ${DATA.length} yapı · ${j.scanner_version||''}`;render()});document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(z=>z.classList.remove('active'));b.classList.add('active');render(b.dataset.f)});</script></body></html>
