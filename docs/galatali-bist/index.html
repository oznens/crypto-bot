<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galatalı BIST</title><script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:8px 10px 35px}.top{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;border-bottom:1px solid #eee;padding:5px 0 8px}.top h1{font-size:20px;margin:0}.muted{font-size:11px;color:#777}.top a{color:#333}.filters{display:flex;gap:5px;flex-wrap:wrap;padding:8px 0}.filters button{background:#fff;border:1px solid #bbb;border-radius:3px;padding:6px 9px;font-weight:650}.filters .active{background:#222;color:#fff}.grid{display:grid;grid-template-columns:1fr;gap:18px}.card{border:1px solid #ddd;background:#fff}.head{padding:6px 10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.sym{font-weight:750}.tags{font-size:11px;color:#666}.stage{position:relative;height:clamp(410px,53vw,690px);background:#fff}.chart{position:absolute;inset:0}.desc{padding:8px 10px 10px;font-size:13px;line-height:1.5}.desc b{font-weight:750}.pos{color:#089981}.neg{color:#f23645}.warn{color:#a66b00}@media(max-width:650px){.wrap{padding:4px}.stage{height:390px}.desc{font-size:11px}.top h1{font-size:17px}}</style></head><body><main class="wrap"><header class="top"><div><h1>Galatalı Metodu — BIST</h1><div id="meta" class="muted">yükleniyor…</div></div><a href="../">Ana sayfa</a></header><nav class="filters"><button data-f="AA" class="active">A+/A</button><button data-f="inside">PRZ içinde</button><button data-f="near">PRZ yakın</button><button data-f="pos">Pozitif</button><button data-f="neg">Negatif</button><button data-f="all">Tümü</button></nav><section id="grid" class="grid"></section></main><script>let DATA=[],CHARTS={};const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function pick(f){if(f==='AA')return DATA.filter(x=>['A+','A'].includes(x.grade));if(f==='inside')return DATA.filter(x=>x.status==='PRZ içinde');if(f==='near')return DATA.filter(x=>x.status==='PRZ yaklaşıyor');if(f==='pos')return DATA.filter(x=>x.direction==='pozitif');if(f==='neg')return DATA.filter(x=>x.direction==='negatif');return DATA}function line(chart,data,color='#222',width=2,style=0){const s=chart.addSeries(LightweightCharts.LineSeries,{color,lineWidth:width,lineStyle:style,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});s.setData(data);return s}function barIndexByDate(b,date){if(!date)return-1;let i=b.findIndex(x=>x.time===date);if(i>=0)return i;let wanted=Date.parse(date),best=-1,dist=Infinity;b.forEach((x,j)=>{let d=Math.abs(Date.parse(x.time)-wanted);if(d<dist){dist=d;best=j}});return best}function nearestPriceIndex(b,price,start,end){start=Math.max(0,start||0);end=Math.min(b.length-1,end==null?b.length-1:end);let best=-1,dist=Infinity;for(let i=start;i<=end;i++){const z=b[i],d=Math.min(Math.abs(+z.high-price),Math.abs(+z.low-price),Math.abs(+z.close-price));if(d<dist){dist=d;best=i}}return best}function pivot(b,name,price,date,start,end){let i=barIndexByDate(b,date);if(i<start||i>(end==null?b.length-1:end))i=-1;if(i<0)i=nearestPriceIndex(b,+price,start,end);return i<0?null:{n:name,p:+price,t:b[i].time,i}}function deriveD(b,f,c){if(f.d_confirmed&&f.d_date){const i=barIndexByDate(b,f.d_date);if(i>=0)return{n:'D',p:+f.d,t:b[i].time,i,confirmed:true}}const lo=+f.prz_low,hi=+f.prz_high,mid=+f.prz_mid,hits=[];for(let i=c.i+1;i<b.length;i++){const z=b[i];if(+z.low<=hi&&+z.high>=lo){const p=f.direction==='pozitif'?Math.max(lo,+z.low):Math.min(hi,+z.high);hits.push({d:Math.abs(p-mid),i,p})}}if(!hits.length)return null;hits.sort((a,z)=>a.i-z.i||a.d-z.d);const h=hits[0];return{n:'D',p:h.p,t:b[h.i].time,i:h.i,confirmed:true}}function fibLeg(chart,p1,p2,ratio,label){const value=p1.p+(p2.p-p1.p)*ratio;const s=line(chart,[{time:p1.t,value},{time:p2.t,value}],'#c8b96c',1,2);if(LightweightCharts.createSeriesMarkers)LightweightCharts.createSeriesMarkers(s,[{time:p2.t,position:'aboveBar',color:'#111',shape:'square',text:label}])}function draw(el,f,b){const chart=LightweightCharts.createChart(el,{layout:{background:{type:'solid',color:'#fff'},textColor:'#4b4b4b',fontSize:10,attributionLogo:false},grid:{vertLines:{color:'#f0f1f2'},horzLines:{color:'#eceeef'}},rightPriceScale:{borderVisible:false,scaleMargins:{top:.08,bottom:.09}},timeScale:{borderColor:'#ddd',rightOffset:22,barSpacing:7,minBarSpacing:2,timeVisible:false},crosshair:{mode:0,vertLine:{color:'#bbb',style:3,labelVisible:false},horzLine:{color:'#bbb',style:3}}});const cs=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350',priceLineVisible:true,priceLineColor:'#ef5350',priceLineStyle:2,lastValueVisible:true});cs.setData(b);const n=b.length;let X=pivot(b,'X',f.x,f.x_date,0,n-4);let A=X&&pivot(b,'A',f.a,f.a_date,X.i+1,n-3);let B=A&&pivot(b,'B',f.b,f.b_date,A.i+1,n-2);let C=B&&pivot(b,'C',f.c,f.c_date,B.i+1,n-1);if(!X||!A||!B||!C){chart.timeScale().fitContent();return}const D=deriveD(b,f,C),geom=[X,A,B,C].concat(D?[D]:[]);line(chart,geom.map(p=>({time:p.t,value:p.p})),'#171717',4,0);if(LightweightCharts.createSeriesMarkers)LightweightCharts.createSeriesMarkers(cs,geom.map((p,i)=>({time:p.t,position:(i%2?'aboveBar':'belowBar'),color:'#111',shape:'square',text:p.n})));const last=b[b.length-1].time,first=b[Math.max(0,X.i-5)].time,lo=+f.prz_low,hi=+f.prz_high,mid=+f.prz_mid,xa=Math.abs(A.p-X.p);line(chart,[{time:first,value:lo},{time:last,value:lo}],'#2962ff',2);line(chart,[{time:first,value:hi},{time:last,value:hi}],'#333',2);const invalid=f.direction==='pozitif'?Math.max(0,lo-xa*.12):hi+xa*.12;line(chart,[{time:first,value:invalid},{time:last,value:invalid}],'#333',2);const target=f.direction==='pozitif'?mid+xa*1.15:Math.max(0,mid-xa*1.15);line(chart,[{time:first,value:target},{time:last,value:target}],'#222',2);fibLeg(chart,X,A,.618,'XA');fibLeg(chart,A,B,Math.min(1,+f.b_xa||.618),String(f.b_xa||.618));fibLeg(chart,B,C,Math.min(1,+f.bc_ab||.618),String(f.bc_ab||.618));if(D){line(chart,[{time:D.t,value:D.p},{time:last,value:target}],'#222',2,0)}else{line(chart,[{time:C.t,value:C.p},{time:last,value:mid}],'#777',3,2)}chart.timeScale().fitContent();new ResizeObserver(x=>chart.applyOptions({width:x[0].contentRect.width,height:x[0].contentRect.height})).observe(el)}function render(filter='AA'){const a=pick(filter).slice(0,60),g=document.getElementById('grid');g.innerHTML=a.map((x,i)=>`<article class="card"><div class="head"><span class="sym">${E(x.symbol)} · ${E(x.timeframe)}</span><span class="tags">${E(x.pattern)} · ${E(x.grade)} · ${E(x.confidence)}/100 · <b class="${x.direction==='pozitif'?'pos':'neg'}">${E(x.status)}</b></span></div><div class="stage"><div id="c${i}" class="chart"></div></div><div class="desc"><b>#${E(x.symbol)}</b> ${x.direction==='pozitif'?'🍀 Pozitif':'Negatif'} ${E(x.pattern)} formasyonu takip ediliyor.<br><b>Destek / toplama bandı:</b> ${E(x.prz_low)}–${E(x.prz_high)} &nbsp; <b>Son:</b> ${E(x.last)}<br><b>X-A-B-C:</b> ${E(x.x_date||'eski veri')} → ${E(x.a_date||'eski veri')} → ${E(x.b_date||'eski veri')} → ${E(x.c_date||'eski veri')}<br><b>D:</b> ${x.d_date?E(x.d_date)+' @ '+E(x.d):'<span class="warn">PRZ teması yoksa C→D projeksiyon gösterilir</span>'}</div></article>`).join('');requestAnimationFrame(()=>a.forEach((x,i)=>{const b=CHARTS[`${x.symbol}|${x.timeframe}`];if(b?.length)draw(document.getElementById('c'+i),x,b)}))}const BASE='https://raw.githubusercontent.com/oznens/crypto-bot/main/data/galatali_bist/';Promise.all([fetch(BASE+'prz_scan.json?x='+Date.now()).then(r=>r.json()),fetch(BASE+'charts.json?x='+Date.now()).then(r=>r.json())]).then(([j,c])=>{DATA=j.findings||[];CHARTS=c.charts||{};document.getElementById('meta').textContent=`${new Date(j.generated_at).toLocaleString('tr-TR')} · ${j.universe} hisse · ${DATA.length} yapı`;render()});document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(z=>z.classList.remove('active'));b.classList.add('active');render(b.dataset.f)});</script></body></html>
