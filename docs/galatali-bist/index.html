<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galatalı BIST</title><script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#131722;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;border-bottom:1px solid #e0e3eb;padding-bottom:10px}.top h1{font-size:22px;margin:3px 0;font-weight:650}.muted,.legend{color:#787b86;font-size:12px}.filters{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.filters button{border:1px solid #d1d4dc;background:#fff;color:#131722;border-radius:4px;padding:7px 10px;font-weight:600}.filters button.active{background:#2962ff;color:#fff;border-color:#2962ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(500px,1fr));gap:12px}.card{background:#fff;border:1px solid #e0e3eb;border-radius:4px;overflow:hidden}.head{padding:8px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #f0f1f3}.sym{font-size:17px;font-weight:700}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:11px;color:#434651;border:1px solid #d1d4dc;padding:2px 5px;border-radius:3px}.grade{font-weight:700}.chart{height:430px;background:#fff}.info{padding:8px 10px;border-top:1px solid #e0e3eb;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:11px;color:#787b86}.info b{display:block;color:#131722;font-size:13px;margin-top:2px}.notes{padding:0 10px 9px;color:#787b86;font-size:11px}.empty{padding:40px;text-align:center;color:#787b86}.pos{color:#089981}.neg{color:#f23645}a{color:#2962ff}@media(max-width:600px){.wrap{padding:5px}.grid{grid-template-columns:1fr}.chart{height:360px}.info{grid-template-columns:repeat(2,1fr)}.top h1{font-size:19px}}</style></head><body><div class="wrap"><div class="top"><div><h1>Galatalı Metodu — Tüm BIST</h1><div id="meta" class="muted">Tarama yükleniyor…</div></div><a href="../">Ana sayfa</a></div><div class="legend">Tweet grafik düzeni · mumlar · harmonik XABCD · Fibonacci/PRZ seviyeleri</div><div class="filters"><button data-f="AA" class="active">A+ / A</button><button data-f="inside">PRZ içinde</button><button data-f="near">PRZ yaklaşıyor</button><button data-f="pos">Pozitif</button><button data-f="neg">Negatif</button><button data-f="all">Tümü</button></div><div id="grid" class="grid"></div><div id="empty" class="empty" style="display:none">Tarama sonucu veya grafik verisi henüz oluşmadı.</div></div><script>let DATA=[],CHARTS={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function pick(f){if(f==='AA')return DATA.filter(x=>['A+','A'].includes(x.grade));if(f==='inside')return DATA.filter(x=>x.status==='PRZ içinde');if(f==='near')return DATA.filter(x=>x.status==='PRZ yaklaşıyor');if(f==='pos')return DATA.filter(x=>x.direction==='pozitif');if(f==='neg')return DATA.filter(x=>x.direction==='negatif');return DATA}function nearestTime(bars,price,from=0){let best=bars[from],d=1e99;for(let i=from;i<bars.length;i++){let x=bars[i],q=Math.min(Math.abs(x.high-price),Math.abs(x.low-price));if(q<d){d=q;best=x}}return best?.time}function draw(el,f,bars){const chart=LightweightCharts.createChart(el,{layout:{background:{type:'solid',color:'#ffffff'},textColor:'#787b86',fontSize:11,attributionLogo:false},grid:{vertLines:{color:'#f0f3fa'},horzLines:{color:'#f0f3fa'}},rightPriceScale:{borderColor:'#d1d4dc',scaleMargins:{top:.08,bottom:.08}},timeScale:{borderColor:'#d1d4dc',timeVisible:false,rightOffset:8,barSpacing:7},crosshair:{mode:0,vertLine:{color:'#9598a1',style:3,width:1},horzLine:{color:'#9598a1',style:3,width:1}},handleScroll:true,handleScale:true});const cs=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#089981',downColor:'#f23645',borderVisible:false,wickUpColor:'#089981',wickDownColor:'#f23645',priceLineVisible:true,lastValueVisible:true});cs.setData(bars);const pts=[['X',f.x],['A',f.a],['B',f.b],['C',f.c],['D',f.prz_mid]];let start=0,line=[];pts.forEach(([n,p])=>{let t=n==='D'?bars[bars.length-1]?.time:nearestTime(bars,p,start);let idx=bars.findIndex(x=>x.time===t);if(idx>=0)start=idx;line.push({time:t,value:+p,label:n})});const ls=chart.addSeries(LightweightCharts.LineSeries,{color:'#2962ff',lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});ls.setData(line.map(x=>({time:x.time,value:x.value})));if(LightweightCharts.createSeriesMarkers)LightweightCharts.createSeriesMarkers(ls,line.map((x,i)=>({time:x.time,position:i%2?'belowBar':'aboveBar',color:'#2962ff',shape:'circle',text:x.label})));const levels=[['PRZ ALT',f.prz_low,'#f23645',2],['D / PRZ',f.prz_mid,'#ff9800',0],['PRZ ÜST',f.prz_high,'#f23645',2]];levels.forEach(([title,price,color,style])=>cs.createPriceLine({price:+price,color,lineWidth:1,lineStyle:style,axisLabelVisible:true,title}));if(f.a!=null&&f.x!=null){const fibs=[.382,.5,.618,.786];const lo=Math.min(+f.x,+f.a),hi=Math.max(+f.x,+f.a),rng=hi-lo;fibs.forEach(r=>cs.createPriceLine({price:lo+rng*r,color:'#9c27b0',lineWidth:1,lineStyle:3,axisLabelVisible:false,title:String(r)}))}chart.timeScale().fitContent();new ResizeObserver(e=>chart.applyOptions({width:e[0].contentRect.width})).observe(el)}function render(f='AA'){const arr=pick(f).slice(0,100),g=document.getElementById('grid');g.innerHTML=arr.map((x,i)=>`<article class="card"><div class="head"><div><span class="sym">${esc(x.symbol)}</span> <span class="${x.direction==='pozitif'?'pos':'neg'}">${esc(x.direction)}</span></div><div class="tags"><span class="tag">${esc(x.timeframe)}</span><span class="tag">${esc(x.pattern)}</span><span class="tag grade">${esc(x.grade)}</span><span class="tag">${esc(x.confidence)}/100</span></div></div><div class="chart" id="ch${i}"></div><div class="info"><div>Fiyat<b>${esc(x.last)}</b></div><div>PRZ<b>${esc(x.prz_low)}–${esc(x.prz_high)}</b></div><div>Mesafe<b>%${esc(x.distance_to_prz_pct)}</b></div><div>Durum<b>${esc(x.status)}</b></div></div><div class="notes">X ${esc(x.x)} · A ${esc(x.a)} · B ${esc(x.b)} · C ${esc(x.c)} · B/XA ${esc(x.b_xa)} · BC/AB ${esc(x.bc_ab)}<br>${esc((x.confirmations||[]).join(' • ')||'D dönüş teyidi bekleniyor')}</div></article>`).join('');document.getElementById('empty').style.display=arr.length?'none':'block';requestAnimationFrame(()=>arr.forEach((x,i)=>{const bars=CHARTS[`${x.symbol}|${x.timeframe}`];if(bars?.length)draw(document.getElementById('ch'+i),x,bars);else document.getElementById('ch'+i).innerHTML='<div class="empty">Mum verisi bekleniyor</div>'}))}const BASE='https://raw.githubusercontent.com/oznens/crypto-bot/main/data/galatali_bist/';Promise.all([fetch(BASE+'prz_scan.json?x='+Date.now()).then(r=>r.json()),fetch(BASE+'charts.json?x='+Date.now()).then(r=>r.ok?r.json():({charts:{}})).catch(()=>({charts:{}}))]).then(([j,c])=>{DATA=j.findings||[];CHARTS=c.charts||{};const aa=DATA.filter(x=>['A+','A'].includes(x.grade)).length;document.getElementById('meta').textContent=`${new Date(j.generated_at).toLocaleString('tr-TR')} · ${j.universe} BIST hissesi · ${DATA.length} yapı · ${aa} A+/A`;render()}).catch(()=>{document.getElementById('meta').textContent='Yeni tüm-BIST taraması bekleniyor';document.getElementById('empty').style.display='block'});document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-f]').forEach(z=>z.classList.remove('active'));b.classList.add('active');render(b.dataset.f)}));</script></body></html>
