<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galatalı BIST</title><script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script><style>*{box-sizing:border-box}html,body{margin:0;background:#f4f4f1;color:#161616;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1500px;margin:auto;padding:10px 12px 40px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:5px 2px 10px}.top h1{font-size:22px;margin:0 0 4px;font-weight:800}.muted{font-size:12px;color:#666}.top a{color:#111;text-decoration:none;font-weight:700}.filters{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;background:#f4f4f1eF;backdrop-filter:blur(8px)}button{font:inherit}.filters button{border:1px solid #aaa;background:#fafafa;color:#222;padding:7px 10px;border-radius:2px;font-size:12px;font-weight:800}.filters button.active{background:#171717;color:#fff;border-color:#171717}.archive-ref{margin:2px 0 12px;border:1px solid #c9c9c3;background:#fff}.archive-ref summary{cursor:pointer;padding:8px 10px;font-size:12px;font-weight:800}.refs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 6px 6px}.refs img{width:100%;display:block;background:#eee;object-fit:contain}.grid{display:grid;grid-template-columns:1fr;gap:18px}.card{background:#fff;border:1px solid #bdbdb7;box-shadow:0 1px 2px #00000012}.head{height:42px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #d8d8d3}.titleline{display:flex;align-items:baseline;gap:8px}.sym{font-size:18px;font-weight:900;letter-spacing:.2px}.dir{font-size:11px;font-weight:800}.pos{color:#16835d}.neg{color:#c32632}.tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.tag{font-size:10px;font-weight:700;border:1px solid #aaa;padding:2px 5px;background:#fff}.stage{position:relative;overflow:hidden;background:#fbfbf8}.chart{height:clamp(330px,46vw,650px);background:#fbfbf8}.watermark{position:absolute;left:14px;top:10px;z-index:4;pointer-events:none;color:#1b1b1b}.watermark .w1{font-size:13px;font-weight:900}.watermark .w2{font-size:10px;color:#666;margin-top:2px}.stamp{position:absolute;right:70px;top:12px;z-index:4;pointer-events:none;border:1px solid #222;background:#fff;padding:3px 6px;font-size:10px;font-weight:900}.caption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:7px 10px;border-top:1px solid #d8d8d3;font-size:11px;line-height:1.45}.caption strong{font-weight:900}.call{font-weight:900}.call.pos{color:#087f5b}.call.neg{color:#c32632}.ratio{color:#666}.empty{padding:40px;text-align:center;color:#777}@media(max-width:700px){.wrap{padding:6px 5px 30px}.top h1{font-size:19px}.refs{grid-template-columns:1fr}.head{height:auto;min-height:42px;align-items:flex-start}.tags{max-width:55%}.chart{height:360px}.stamp{right:58px}.caption{font-size:10px}}</style></head><body><main class="wrap"><header class="top"><div><h1>Galatalı Metodu — Tüm BIST</h1><div id="meta" class="muted">Tarama yükleniyor…</div></div><a href="../">ANA SAYFA</a></header><details class="archive-ref"><summary>GALATALI ARŞİVİNDEN GERÇEK GRAFİK REFERANSLARI</summary><div class="refs"><img src="https://pbs.twimg.com/media/HQFPbxvWkAAL7tW.jpg" alt="Galatalı arşiv grafik referansı"><img src="https://pbs.twimg.com/media/HQAA78yXgAAGE03.jpg" alt="Galatalı arşiv grafik referansı"></div></details><nav class="filters"><button data-f="AA" class="active">A+ / A</button><button data-f="inside">PRZ İÇİNDE</button><button data-f="near">PRZ YAKIN</button><button data-f="pos">POZİTİF</button><button data-f="neg">NEGATİF</button><button data-f="all">TÜMÜ</button></nav><section id="grid" class="grid"></section><div id="empty" class="empty" style="display:none">Tarama sonucu veya grafik verisi henüz oluşmadı.</div></main><script>let DATA=[],CHARTS={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function pick(f){if(f==='AA')return DATA.filter(x=>['A+','A'].includes(x.grade));if(f==='inside')return DATA.filter(x=>x.status==='PRZ içinde');if(f==='near')return DATA.filter(x=>x.status==='PRZ yaklaşıyor');if(f==='pos')return DATA.filter(x=>x.direction==='pozitif');if(f==='neg')return DATA.filter(x=>x.direction==='negatif');return DATA}function nearestIndex(bars,price,from=0){let bi=from,d=Infinity;for(let i=from;i<bars.length;i++){let b=bars[i],q=Math.min(Math.abs(+b.high-price),Math.abs(+b.low-price));if(q<d){d=q;bi=i}}return bi}function draw(el,f,bars){const chart=LightweightCharts.createChart(el,{layout:{background:{type:'solid',color:'#fbfbf8'},textColor:'#4a4a46',fontFamily:'Arial,Helvetica,sans-serif',fontSize:10,attributionLogo:false},grid:{vertLines:{color:'#e7e7e1',style:0},horzLines:{color:'#dfdfda',style:0}},rightPriceScale:{borderColor:'#8f8f89',scaleMargins:{top:.08,bottom:.08},ticksVisible:true},timeScale:{borderColor:'#8f8f89',timeVisible:false,rightOffset:5,barSpacing:8,minBarSpacing:3,ticksVisible:true},crosshair:{mode:0,vertLine:{color:'#8a8a84',style:3,width:1,labelVisible:false},horzLine:{color:'#8a8a84',style:3,width:1}},handleScroll:true,handleScale:true});const cs=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#f7f7f3',downColor:'#242424',borderUpColor:'#242424',borderDownColor:'#242424',wickUpColor:'#242424',wickDownColor:'#242424',priceLineVisible:false,lastValueVisible:true});cs.setData(bars);let idx=0,raw=[['X',+f.x],['A',+f.a],['B',+f.b],['C',+f.c]],pts=[];for(const [name,price] of raw){idx=nearestIndex(bars,price,idx);pts.push({name,price,time:bars[idx].time,idx})}const dIdx=Math.min(bars.length-1,Math.max(idx+1,bars.length-3)),d={name:'D',price:+f.prz_mid,time:bars[dIdx].time,idx:dIdx};pts.push(d);const leg=chart.addSeries(LightweightCharts.LineSeries,{color:'#171717',lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});leg.setData(pts.map(p=>({time:p.time,value:p.price})));if(LightweightCharts.createSeriesMarkers){LightweightCharts.createSeriesMarkers(leg,pts.map((p,i)=>({time:p.time,position:i%2?'belowBar':'aboveBar',color:'#111',shape:'circle',text:p.name})))}const lo=+f.prz_low,hi=+f.prz_high,mid=+f.prz_mid;cs.createPriceLine({price:lo,color:'#a61d24',lineWidth:2,lineStyle:2,axisLabelVisible:true,title:'PRZ'});cs.createPriceLine({price:hi,color:'#a61d24',lineWidth:2,lineStyle:2,axisLabelVisible:true,title:'PRZ'});cs.createPriceLine({price:mid,color:'#111',lineWidth:1,lineStyle:0,axisLabelVisible:true,title:'D'});const xa=Math.abs(+f.a-(+f.x));const base=Math.min(+f.x,+f.a);[.382,.5,.618,.786,.886].forEach(r=>cs.createPriceLine({price:base+xa*r,color:'#777',lineWidth:1,lineStyle:3,axisLabelVisible:false,title:String(r)}));const projected=f.direction==='pozitif'?mid+xa*.618:mid-xa*.618;cs.createPriceLine({price:projected,color:'#1d6f42',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'HEDEF'});chart.timeScale().fitContent();new ResizeObserver(e=>chart.applyOptions({width:e[0].contentRect.width})).observe(el)}function render(filter='AA'){const arr=pick(filter).slice(0,60),g=document.getElementById('grid');g.innerHTML=arr.map((x,i)=>`<article class="card"><header class="head"><div class="titleline"><span class="sym">${esc(x.symbol)}</span><span class="dir ${x.direction==='pozitif'?'pos':'neg'}">${esc(x.direction).toUpperCase()}</span></div><div class="tags"><span class="tag">${esc(x.timeframe)}</span><span class="tag">${esc(x.pattern)}</span><span class="tag">${esc(x.grade)}</span><span class="tag">${esc(x.confidence)}/100</span></div></header><div class="stage"><div class="watermark"><div class="w1">${esc(x.symbol)} · ${esc(x.timeframe)}</div><div class="w2">${esc(x.pattern)} — X A B C D</div></div><div class="stamp">${esc(x.status)}</div><div class="chart" id="ch${i}"></div></div><div class="caption"><span><strong>PRZ / DOĞRU MALİYET:</strong> ${esc(x.prz_low)} — ${esc(x.prz_high)} &nbsp; <strong>SON:</strong> ${esc(x.last)}</span><span class="call ${x.direction==='pozitif'?'pos':'neg'}">${x.direction==='pozitif'?'POZİTİF FORMASYON':'NEGATİF FORMASYON'}</span><span class="ratio">X ${esc(x.x)} · A ${esc(x.a)} · B ${esc(x.b)} · C ${esc(x.c)} · B/XA ${esc(x.b_xa)} · BC/AB ${esc(x.bc_ab)}</span></div></article>`).join('');document.getElementById('empty').style.display=arr.length?'none':'block';requestAnimationFrame(()=>arr.forEach((x,i)=>{const bars=CHARTS[`${x.symbol}|${x.timeframe}`],el=document.getElementById('ch'+i);if(bars?.length)draw(el,x,bars);else el.innerHTML='<div class="empty">Mum verisi bekleniyor</div>'}))}const BASE='https://raw.githubusercontent.com/oznens/crypto-bot/main/data/galatali_bist/';Promise.all([fetch(BASE+'prz_scan.json?x='+Date.now()).then(r=>r.json()),fetch(BASE+'charts.json?x='+Date.now()).then(r=>r.ok?r.json():({charts:{}})).catch(()=>({charts:{}}))]).then(([j,c])=>{DATA=j.findings||[];CHARTS=c.charts||{};const aa=DATA.filter(x=>['A+','A'].includes(x.grade)).length;document.getElementById('meta').textContent=`${new Date(j.generated_at).toLocaleString('tr-TR')} · ${j.universe} BIST hissesi · ${DATA.length} yapı · ${aa} A+/A`;render()}).catch(()=>{document.getElementById('meta').textContent='Yeni tüm-BIST taraması bekleniyor';document.getElementById('empty').style.display='block'});document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(z=>z.classList.remove('active'));b.classList.add('active');render(b.dataset.f)});</script></body></html>
