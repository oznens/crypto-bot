<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galatalı BIST Harmonik Tarayıcı</title><script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#edf0f2;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1500px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap}.top h1{font-size:24px;margin:4px 0}.muted{color:#89919b;font-size:13px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.filters button{border:1px solid #303741;background:#15191f;color:#ddd;border-radius:6px;padding:9px 12px;font-weight:700}.filters button.active{background:#e9edf2;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(470px,1fr));gap:12px}.card{background:#101318;border:1px solid #252b33;border-radius:8px;overflow:hidden}.head{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}.sym{font-size:20px;font-weight:900}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:11px;border:1px solid #353d47;padding:3px 6px;border-radius:4px}.grade{font-weight:900}.Aplus{color:#67e8a5}.A{color:#a7f3d0}.B{color:#fde68a}.chart{height:390px;background:#080a0d}.info{padding:9px 12px;border-top:1px solid #252b33;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:12px}.info b{display:block;font-size:14px;margin-top:2px}.notes{padding:0 12px 11px;color:#aeb5be;font-size:12px}.empty{padding:40px;text-align:center;border:1px dashed #343b44}.legend{font-size:12px;color:#9da5af;margin:8px 0 14px}.pos{color:#6ee7a8}.neg{color:#fb9292}@media(max-width:600px){.wrap{padding:8px}.grid{grid-template-columns:1fr}.chart{height:330px}.info{grid-template-columns:repeat(2,1fr)}.top h1{font-size:20px}}</style></head><body><div class="wrap"><div class="top"><div><h1>Galatalı Metodu — Tüm BIST</h1><div id="meta" class="muted">Tarama yükleniyor…</div></div><a href="../" style="color:#cdd3da">Ana sayfa</a></div><div class="legend">Mum grafik + X-A-B-C harmonik çizimi + D/PRZ bandı. A+/A adaylar önde. Grafikler Galatalı'nın kullandığı sade teknik/harmonik okuma düzenine göre hazırlanır.</div><div class="filters"><button data-f="AA" class="active">A+ / A</button><button data-f="inside">PRZ içinde</button><button data-f="near">PRZ yaklaşıyor</button><button data-f="pos">Pozitif</button><button data-f="neg">Negatif</button><button data-f="all">Tümü</button></div><div id="grid" class="grid"></div><div id="empty" class="empty" style="display:none">Tarama sonucu veya grafik verisi henüz oluşmadı.</div></div><script>let DATA=[],CHARTS={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function pick(f){if(f==='AA')return DATA.filter(x=>['A+','A'].includes(x.grade));if(f==='inside')return DATA.filter(x=>x.status==='PRZ içinde');if(f==='near')return DATA.filter(x=>x.status==='PRZ yaklaşıyor');if(f==='pos')return DATA.filter(x=>x.direction==='pozitif');if(f==='neg')return DATA.filter(x=>x.direction==='negatif');return DATA}function nearestTime(bars,price,from=0){let best=bars[from],d=1e99;for(let i=from;i<bars.length;i++){let x=bars[i],q=Math.min(Math.abs(x.high-price),Math.abs(x.low-price));if(q<d){d=q;best=x}}return best?.time}function draw(el,f,bars){const chart=LightweightCharts.createChart(el,{layout:{background:{type:'solid',color:'#080a0d'},textColor:'#aab2bc',attributionLogo:true},grid:{vertLines:{color:'#15191f'},horzLines:{color:'#15191f'}},rightPriceScale:{borderColor:'#2a3038'},timeScale:{borderColor:'#2a3038',timeVisible:false},crosshair:{mode:0},handleScroll:true,handleScale:true});const cs=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#d8dde3',downColor:'#4c535d',borderUpColor:'#d8dde3',borderDownColor:'#4c535d',wickUpColor:'#aeb5bd',wickDownColor:'#606873'});cs.setData(bars);const pts=[['X',f.x],['A',f.a],['B',f.b],['C',f.c]];let start=0,line=[];pts.forEach(([n,p])=>{let t=nearestTime(bars,p,start);let idx=bars.findIndex(x=>x.time===t);if(idx>=0)start=idx;line.push({time:t,value:p,label:n})});const ls=chart.addSeries(LightweightCharts.LineSeries,{color:'#d7b35a',lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});ls.setData(line.map(x=>({time:x.time,value:x.value})));if(LightweightCharts.createSeriesMarkers)LightweightCharts.createSeriesMarkers(ls,line.map(x=>({time:x.time,position:'atPriceTop',price:x.value,color:'#d7b35a',shape:'circle',text:x.label})));cs.createPriceLine({price:f.prz_low,color:'#bd7b45',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'PRZ alt'});cs.createPriceLine({price:f.prz_high,color:'#bd7b45',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'PRZ üst'});cs.createPriceLine({price:f.prz_mid,color:'#e0a15c',lineWidth:2,lineStyle:0,axisLabelVisible:true,title:'D'});chart.timeScale().fitContent();new ResizeObserver(e=>chart.applyOptions({width:e[0].contentRect.width})).observe(el)}function render(f='AA'){const arr=pick(f).slice(0,100),g=document.getElementById('grid');g.innerHTML=arr.map((x,i)=>`<article class="card"><div class="head"><div><span class="sym">${esc(x.symbol)}</span> <span class="${x.direction==='pozitif'?'pos':'neg'}">${esc(x.direction)}</span></div><div class="tags"><span class="tag">${esc(x.timeframe)}</span><span class="tag">${esc(x.pattern)}</span><span class="tag grade ${x.grade==='A+'?'Aplus':x.grade}">${esc(x.grade)}</span><span class="tag">${esc(x.confidence)}/100</span></div></div><div class="chart" id="ch${i}"></div><div class="info"><div>Fiyat<b>${esc(x.last)}</b></div><div>PRZ<b>${esc(x.prz_low)}–${esc(x.prz_high)}</b></div><div>Mesafe<b>%${esc(x.distance_to_prz_pct)}</b></div><div>Durum<b>${esc(x.status)}</b></div></div><div class="notes">X ${esc(x.x)} · A ${esc(x.a)} · B ${esc(x.b)} · C ${esc(x.c)} · B/XA ${esc(x.b_xa)} · BC/AB ${esc(x.bc_ab)}<br>${esc((x.confirmations||[]).join(' • ')||'D dönüş teyidi bekleniyor')}</div></article>`).join('');document.getElementById('empty').style.display=arr.length?'none':'block';requestAnimationFrame(()=>arr.forEach((x,i)=>{const bars=CHARTS[`${x.symbol}|${x.timeframe}`];if(bars?.length)draw(document.getElementById('ch'+i),x,bars);else document.getElementById('ch'+i).innerHTML='<div class="empty">Mum verisi bekleniyor</div>'}))}const BASE='https://raw.githubusercontent.com/oznens/crypto-bot/main/data/galatali_bist/';Promise.all([fetch(BASE+'prz_scan.json?x='+Date.now()).then(r=>r.json()),fetch(BASE+'charts.json?x='+Date.now()).then(r=>r.ok?r.json():({charts:{}})).catch(()=>({charts:{}}))]).then(([j,c])=>{DATA=j.findings||[];CHARTS=c.charts||{};const aa=DATA.filter(x=>['A+','A'].includes(x.grade)).length;document.getElementById('meta').textContent=`${new Date(j.generated_at).toLocaleString('tr-TR')} · ${j.universe} BIST hissesi · ${DATA.length} yapı · ${aa} A+/A`;render()}).catch(()=>{document.getElementById('meta').textContent='Yeni tüm-BIST taraması bekleniyor';document.getElementById('empty').style.display='block'});document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-f]').forEach(z=>z.classList.remove('active'));b.classList.add('active');render(b.dataset.f)}));</script></body></html>
